<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Ledger - Dark Fantasy</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    /* Dark Fantasy Deep Purple & Gold Palette */
    --bg:#090410;
    --panel:#110820;
    --panel-alt:#180b2d;
    --hair:#331b54;
    --white:#fcf6e3;
    --dim:#9c8cb0;
    --accent:#dca431;
    --accent-bright:#ffcc4d;
    --accent-dim:#78540c;
    --accent-glow:rgba(220, 164, 49, 0.55);
    --accent-glow-soft:rgba(220, 164, 49, 0.22);
    --purple-glow:rgba(128, 56, 230, 0.3);
    --gray:#63527a;
    --shadow-deep:0 35px 80px rgba(0,0,0,0.85), 0 2px 0 rgba(255,204,77,0.05) inset;
  }

  *{ box-sizing:border-box; }

  html{ background:var(--bg); }

  body{
    margin:0;
    position:relative;
    background-color:var(--bg);
    background-image:
      radial-gradient(ellipse 1200px 700px at 50% -10%, var(--purple-glow), transparent 60%),
      radial-gradient(ellipse 1000px 800px at 100% 110%, var(--accent-glow-soft), transparent 55%),
      repeating-linear-gradient(0deg, rgba(128,56,230,0.04) 0px, rgba(128,56,230,0.04) 1px, transparent 1px, transparent 28px);
    color:var(--white);
    font-family:'Rajdhani', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }

  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:1;
    background-image:radial-gradient(circle at 1px 1px, rgba(255,204,77,0.04) 1px, transparent 0);
    background-size:3px 3px;
    opacity:0.7;
    mix-blend-mode:color-dodge;
  }
  body::after{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:1;
    box-shadow:inset 0 0 250px rgba(0,0,0,0.95);
  }

  .mono{ font-family:'JetBrains Mono', monospace; }

  #app{ position:relative; z-index:2; max-width:1900px; width:100%; margin:0 auto; padding:32px clamp(16px,4vw,56px) 80px; }

  .cut{ clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px); }
  .cut-sm{ clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }

  .header{
    display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between;
    gap:16px; margin-bottom:28px; padding-bottom:22px; border-bottom:1px solid var(--hair); position:relative;
  }
  .title{
    font-family:'Cinzel', serif;
    font-size:clamp(36px,4vw,54px); font-weight:800; text-transform:uppercase; letter-spacing:0.12em;
    text-shadow:0 0 40px var(--accent-glow), 0 0 80px var(--purple-glow); margin:0; line-height:1;
  }
  .title span{ color:var(--accent-bright); animation:flicker 4s infinite alternate; text-shadow:0 0 20px var(--accent-glow); }
  .title-rule{
    width:80px; height:4px; margin-top:14px; background:linear-gradient(90deg, var(--accent-bright), transparent);
    box-shadow:0 0 15px var(--accent-glow);
  }
  .subtitle{ font-size:14px; color:var(--accent-bright); letter-spacing:0.1em; margin-top:12px; font-weight:600; text-shadow: 0 0 10px var(--accent-glow-soft); }

  .progress-row{ display:flex; align-items:center; gap:12px; margin-top:14px; }
  .progress-track{ width:180px; height:8px; background:var(--panel-alt); border:1px solid var(--hair); box-shadow:inset 0 2px 5px rgba(0,0,0,0.8); border-radius:4px; overflow:hidden;}
  .progress-fill{ height:100%; background:linear-gradient(90deg, var(--accent-dim), var(--accent-bright)); box-shadow:0 0 15px var(--accent-glow); transition:width .5s cubic-bezier(0.4, 0, 0.2, 1); }
  .progress-text{ font-size:13px; color:var(--accent-bright); letter-spacing:0.08em; text-shadow:0 0 8px var(--accent-glow); }

  @keyframes flicker{
    0%,92%,100%{ opacity:1; }
    93%{ opacity:0.8; }
    95%{ opacity:1; }
    96%{ opacity:0.85; }
    97%{ opacity:1; text-shadow:0 0 40px var(--accent-bright); }
  }

  select{
    appearance:none; -webkit-appearance:none; background-color:var(--panel); color:var(--accent-bright);
    border:1px solid var(--accent); padding:12px 18px; font-size:13px; letter-spacing:0.08em;
    font-family:'JetBrains Mono', monospace; cursor:pointer; box-shadow:var(--shadow-deep);
    transition:box-shadow .3s ease, border-color .3s ease; text-transform: uppercase;
  }
  select:hover{ box-shadow:0 0 25px var(--accent-glow), var(--shadow-deep); border-color:var(--accent-bright); }
  select option{ background:#0a0512; color:var(--white); }
  .select-row{ display:flex; gap:10px; }

  .actions{ display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:28px; }
  button{ cursor:pointer; font-family:inherit; }

  .btn{
    display:inline-flex; align-items:center; gap:8px; font-size:15px; font-weight:700;
    padding:12px 22px; text-transform:uppercase; letter-spacing:0.08em;
    background:var(--panel); color:var(--white); border:1px solid var(--hair);
    box-shadow:var(--shadow-deep);
    transition:box-shadow .25s ease, transform .2s cubic-bezier(0.4, 0, 0.2, 1), border-color .25s ease;
  }
  .btn:hover{ box-shadow:0 0 25px var(--purple-glow), var(--shadow-deep); transform:translateY(-2px); border-color:var(--dim); }
  .btn:active{ transform:translateY(0); }
  .btn.active, .btn.primary{ background:linear-gradient(180deg, var(--accent-bright), var(--accent)); color:#05020a; border-color:var(--accent-bright); box-shadow:0 0 20px var(--accent-glow); text-shadow:none;}
  .btn.primary:hover{ box-shadow:0 0 35px var(--accent-glow); border-color:#fff; }

  .warn{ font-size:13px; color:var(--accent-bright); font-family:'JetBrains Mono', monospace; text-shadow:0 0 8px var(--accent-glow); }

  .add-form{
    display:flex; align-items:center; gap:10px; margin-bottom:28px; padding:18px;
    background:var(--panel); border:1px solid var(--accent-dim); box-shadow:var(--shadow-deep), 0 0 30px var(--purple-glow) inset;
  }
  .add-form input{
    flex:1; font-family:'JetBrains Mono', monospace; font-size:14px; padding:12px 18px;
    background:#06030c; border:1px solid var(--hair); color:var(--accent-bright); outline:none; letter-spacing:0.05em;
    transition:border-color .25s ease, box-shadow .25s ease;
  }
  .add-form input:focus{ border-color:var(--accent-bright); box-shadow:0 0 20px var(--accent-glow-soft); }
  .add-form input::placeholder{ color:var(--gray); }

  .empty{
    text-align:center; padding:80px 20px; border:1px dashed var(--accent-dim); color:var(--dim); margin-bottom:32px;
    background:radial-gradient(ellipse at center, rgba(220,164,49,0.08), transparent 70%);
    box-shadow:inset 0 0 50px rgba(0,0,0,0.5);
  }
  .empty .big{ font-family:'Cinzel', serif; font-size:24px; font-weight:800; text-transform:uppercase; letter-spacing:0.15em; color:var(--accent-bright); margin-bottom:12px; text-shadow:0 0 25px var(--accent-glow); }
  .empty .small{ font-size:13px; font-family:'JetBrains Mono', monospace; letter-spacing:0.06em; }

  .panel{ background:var(--panel); border:1px solid var(--hair); padding:22px; margin-bottom:32px; box-shadow:var(--shadow-deep); position:relative; overflow:hidden;}
  .panel::after{ content:''; position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 40px rgba(128,56,230,0.1); }

  .chart-svg{ width:100%; display:block; position:relative; z-index:2; }
  .chart-svg.bar{ height:clamp(220px,28vw,280px); }
  .chart-svg.line{ height:clamp(280px,36vw,420px); }
  .grid-line{ stroke:var(--hair); stroke-width:1.5; stroke-dasharray:4 4; opacity:0.5;}
  .axis-label{ fill:var(--dim); font-size:12px; font-family:'JetBrains Mono', monospace; font-weight:500; letter-spacing:0.05em;}
  .bar-value{ fill:var(--accent-bright); font-size:12px; font-family:'JetBrains Mono', monospace; font-weight:700; filter:drop-shadow(0 0 4px var(--accent-glow));}

  .legend{ display:flex; flex-wrap:wrap; gap:16px; margin-top:14px; position:relative; z-index:2;}
  .legend-item{ display:flex; align-items:center; gap:8px; font-size:13px; font-family:'JetBrains Mono', monospace; color:var(--white); text-transform:uppercase;}
  .legend-dot{ width:10px; height:10px; flex-shrink:0; box-shadow:0 0 10px currentColor; clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);}

  .table-wrap{
    overflow-x:auto; background:var(--panel); border:1px solid var(--hair); box-shadow:var(--shadow-deep);
    width:100%; position:relative; border-top:3px solid var(--accent-bright);
  }
  table{ border-collapse:collapse; width:100%; min-width:820px; table-layout:fixed; font-size:15px; }
  th, td{ white-space:nowrap; }
  th.list-head, td.name-cell{ white-space:normal; }
  thead th{
    text-align:center; font-weight:600; padding:10px 6px; font-size:12px;
    border-left:1px solid var(--hair); font-family:'JetBrains Mono', monospace; color:var(--dim);
    background:var(--panel); border-bottom:1px solid var(--hair);
  }
  thead th.weekend{ background:var(--panel-alt); color:var(--gray); }
  thead th.today-col{ background:var(--accent-dim); color:var(--accent-bright); font-weight:800; box-shadow:inset 0 0 20px rgba(220,164,49,0.3); text-shadow:0 0 8px var(--accent-glow); }
  thead .list-head{
    position:sticky; left:0; z-index:3; text-align:left; font-weight:800; text-transform:uppercase;
    letter-spacing:0.1em; padding:12px 14px 12px 24px; border-right:2px solid var(--accent); background:var(--panel-alt);
    color:var(--accent-bright); font-family:'Cinzel', serif; width:220px;
    box-shadow:6px 0 20px rgba(0,0,0,0.8);
  }
  tbody td.name-cell{
    position:sticky; left:0; z-index:3; background:var(--panel); border-right:2px solid var(--accent);
    border-top:1px solid var(--hair); padding:12px 14px 12px 24px;
    box-shadow:6px 0 20px rgba(0,0,0,0.8);
  }
  tbody td.day-cell{ text-align:center; padding:10px 4px; border-left:1px solid var(--hair); border-top:1px solid var(--hair); }
  tbody td.day-cell.weekend{ background:#0b0514; }
  tbody tr:hover td.day-cell{ background:rgba(128,56,230,0.1); }
  tbody tr:hover td.day-cell.weekend{ background:rgba(128,56,230,0.15); }
  tbody tr:hover td.name-cell{ background:#160b29; }

  .name-row{ display:flex; align-items:flex-start; gap:12px; }
  .name-dot{ width:10px; height:10px; flex-shrink:0; margin-top:6px; clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); }
  .name-text{ font-weight:700; font-size:15px; text-transform:uppercase; letter-spacing:0.06em; word-break:break-word; overflow-wrap:break-word; min-width:0; flex:1; text-shadow:0 2px 4px rgba(0,0,0,0.8); }
  .del-btn{ margin-left:4px; margin-top:2px; flex-shrink:0; opacity:0.4; background:none; border:none; color:var(--accent-bright); display:flex; align-items:center; transition:all .2s ease; cursor:pointer;}
  .del-btn:hover{ opacity:1; filter:drop-shadow(0 0 8px var(--accent-glow)); transform:scale(1.1);}

  .cell-today{
    width:28px; height:28px; border:1px solid var(--accent); background:transparent; display:flex;
    align-items:center; justify-content:center; margin:0 auto; transition:all .2s cubic-bezier(0.4, 0, 0.2, 1);
    animation:pulse-idle 3s ease-in-out infinite; cursor:pointer; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  }
  .cell-today:hover{ box-shadow:0 0 20px var(--accent-glow); transform:scale(1.15); background:rgba(220,164,49,0.1); }
  .cell-today.checked{ background:linear-gradient(135deg, var(--accent-bright), var(--accent)); box-shadow:0 0 25px var(--accent-glow); animation:none; border:none;}

  @keyframes pulse-idle{
    0%,100%{ box-shadow:0 0 0 rgba(220,164,49,0); border-color:var(--accent-dim); }
    50%{ box-shadow:0 0 15px var(--accent-glow-soft); border-color:var(--accent-bright); }
  }

  .cell-future{
    width:28px; height:28px; border:1px dashed var(--gray); display:flex; align-items:center;
    justify-content:center; margin:0 auto; color:var(--hair); clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  }
  .cell-past{
    width:28px; height:28px; border:1px solid var(--hair); display:flex; align-items:center;
    justify-content:center; margin:0 auto; opacity:0.4; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  }
  .cell-past.checked{ opacity:1; box-shadow:0 0 12px rgba(0,0,0,0.8) inset; border:none; }

  .foot-note{ font-size:12px; color:var(--dim); font-family:'JetBrains Mono', monospace; letter-spacing:0.05em; margin-top:16px; text-transform:uppercase; text-align:center;}

  @media (max-width:640px){
    .header{ flex-direction:column; }
    thead .list-head, tbody td.name-cell{ width:150px; padding-left:14px; }
  }

  /* ===== Theme Switcher ===== */
  .theme-switcher{
    position:fixed; top:14px; right:14px; z-index:9999;
    display:flex; gap:8px; padding:8px;
    background:rgba(0,0,0,0.55); border:1px solid rgba(255,255,255,0.18);
    border-radius:30px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .theme-dot{
    width:18px; height:18px; border-radius:50%; display:block;
    border:2px solid rgba(255,255,255,0.3); box-sizing:border-box;
    text-decoration:none; transition:transform .2s ease, border-color .2s ease;
  }
  .theme-dot:hover{ transform:scale(1.25); border-color:#fff; }
  .theme-dot.active{ border-color:#fff; box-shadow:0 0 10px currentColor; transform:scale(1.15); pointer-events:none; cursor:default; }
  @media (max-width:520px){
    .theme-switcher{ top:8px; right:8px; padding:6px; gap:6px; }
    .theme-dot{ width:14px; height:14px; }
  }
</style>
</head>
<body>
<div class="theme-switcher" role="navigation" aria-label="Switch theme">
  <a href="index.html" class="theme-dot active" style="background:#dca431" title="Dark Fantasy"></a>
  <a href="i2.html" class="theme-dot" style="background:#e4283c" title="Crimson Noir"></a>
  <a href="i3.html" class="theme-dot" style="background:#ff8c42" title="Amber Grade"></a>
  <a href="i4.html" class="theme-dot" style="background:#10b981" title="Cinematic Emerald"></a>
  <a href="i5.html" class="theme-dot" style="background:#00e5ff" title="Cyberpunk 2099"></a>
  <a href="i6.html" class="theme-dot" style="background:#ff2a4b" title="Studio Trigger"></a>
</div>
<div id="app"></div>

<script>
(function(){
  "use strict";

  var API_URL = "/api/data";
  // Dark Fantasy / Purple & Gold Palette
  var PALETTE = ["#dca431", "#8a2be2", "#ffcc4d", "#4b0082", "#b8860b", "#9400d3", "#daa520", "#483d8b"];
  var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var MONTH_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  var topics = [];
  var checks = {};
  var view = "month";
  var showAdd = false;
  var syncWarning = false;
  var loadError = "";

  var now0 = new Date();
  var selMonth = now0.getMonth();
  var selYear = now0.getFullYear();

  function colorFor(i){ return PALETTE[i % PALETTE.length]; }
  function pad2(n){ return String(n).padStart(2,"0"); }
  function keyFor(y,m,d){ return y+"-"+pad2(m+1)+"-"+pad2(d); }
  function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
  function weekdayLetter(y,m,d){ return new Date(y,m,d).toLocaleDateString("en-US",{weekday:"narrow"}); }
  function isWeekend(y,m,d){ var day = new Date(y,m,d).getDay(); return day===0 || day===6; }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  async function loadData(){
    try{
      var res = await fetch(API_URL + "?t=" + Date.now(), { cache: "no-store" });
      if(!res.ok) throw new Error("Server returned " + res.status);
      var state = await res.json();
      topics = Array.isArray(state.topics) ? state.topics : [];
      checks = (state.checks && typeof state.checks === "object") ? state.checks : {};
      loadError = "";
    }catch(e){
      console.error("loadData failed", e);
      topics = []; checks = {};
      loadError = "Aetheric connection severed \u2014 check your connection and reload. Changes made now will fade into the void.";
    }
  }

  async function persist(){
    try{
      var res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ topics: topics, checks: checks })
      });
      if(!res.ok) throw new Error("Server returned " + res.status);
      syncWarning = false;
    }catch(e){
      console.error("persist failed", e);
      syncWarning = true;
    }
    render();
  }

  function cellStatus(y,m,d,todayOnly){
    var t = new Date(y,m,d).getTime();
    if(t === todayOnly) return "today";
    return t > todayOnly ? "future" : "past";
  }

  function addTopic(name){
    name = (name||"").trim();
    if(!name) return;
    topics.push({ id: "t" + Date.now() + Math.floor(Math.random()*1000), name: name });
    render();
    persist();
  }

  function deleteTopic(id, name){
    var ok = window.confirm('Banish "' + name + '" and all its history to the void? This cannot be undone.');
    if(!ok) return;
    topics = topics.filter(function(t){ return t.id !== id; });
    delete checks[id];
    render();
    persist();
  }

  function toggleCheck(topicId, key, todayKey){
    if(key !== todayKey) return;
    if(!checks[topicId]) checks[topicId] = {};
    if(checks[topicId][key]) delete checks[topicId][key];
    else checks[topicId][key] = true;
    render();
    persist();
  }

  function buildBarChartSVG(data){
    var w = 900, h = 220, padL = 10, padR = 10, padT = 26, padB = 34;
    var chartW = w - padL - padR, chartH = h - padT - padB;
    var maxVal = Math.max(1, Math.max.apply(null, data.map(function(d){return d.count;})));
    var n = data.length || 1;
    var gap = 20;
    var barW = Math.max(20, (chartW / n) - gap);
    var defs = '<defs><filter id="glow" x="-60%" y="-60%" width="220%" height="220%">' +
      '<feGaussianBlur stdDeviation="4" result="blur"/>' +
      '<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>' +
      '</filter></defs>';
    data.forEach(function(d,i){
      defs += '<linearGradient id="barGrad'+i+'" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="'+d.fill+'" stop-opacity="1"/>' +
        '<stop offset="100%" stop-color="'+d.fill+'" stop-opacity="0.1"/>' +
        '</linearGradient>';
    });
    var grid = "";
    for(var g=0; g<=4; g++){
      var gy = padT + chartH - (g/4)*chartH;
      grid += '<line x1="'+padL+'" y1="'+gy+'" x2="'+(w-padR)+'" y2="'+gy+'" class="grid-line"/>';
    }
    var bars = "";
    data.forEach(function(d,i){
      var x = padL + i*(barW+gap) + gap/2;
      var barH = Math.max(2, (d.count/maxVal) * chartH);
      var y = padT + chartH - barH;
      var maxChars = Math.max(3, Math.floor(barW / 6.5));
      var label = d.name.length > maxChars ? (d.name.slice(0, Math.max(1,maxChars-1)) + "\u2026") : d.name;
      // Slanted top for dark fantasy edge
      var pathD = 'M'+x+','+(y+6)+' L'+(x+barW/2)+','+y+' L'+(x+barW)+','+(y+6)+' L'+(x+barW)+','+(y+barH)+' L'+x+','+(y+barH)+' Z';
      bars += '<path d="'+pathD+'" fill="url(#barGrad'+i+')" filter="url(#glow)"/>';
      bars += '<text x="'+(x+barW/2)+'" y="'+(h-10)+'" text-anchor="middle" class="axis-label">'+escapeHtml(label)+(label!==d.name ? '<title>'+escapeHtml(d.name)+'</title>' : '')+'</text>';
      bars += '<text x="'+(x+barW/2)+'" y="'+(y-8)+'" text-anchor="middle" class="bar-value">'+d.count+'</text>';
    });
    return '<svg viewBox="0 0 '+w+' '+h+'" class="chart-svg bar" preserveAspectRatio="none">'+defs+grid+bars+'</svg>';
  }

  function buildLineChartSVG(months, series){
    var w = 960, h = 320, padL = 24, padR = 24, padT = 18, padB = 34;
    var chartW = w - padL - padR, chartH = h - padT - padB;
    var allVals = series.reduce(function(acc,s){ return acc.concat(s.values); }, []);
    var maxVal = Math.max(1, Math.max.apply(null, allVals.length ? allVals : [0]));
    var stepX = chartW / Math.max(1, months.length - 1);
    var defs = '<defs><filter id="lineGlow" x="-60%" y="-60%" width="220%" height="220%">' +
      '<feGaussianBlur stdDeviation="3.5" result="blur"/>' +
      '<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>' +
      '</filter></defs>';
    var grid = "";
    for(var g=0; g<=4; g++){
      var gy = padT + chartH - (g/4)*chartH;
      grid += '<line x1="'+padL+'" y1="'+gy+'" x2="'+(w-padR)+'" y2="'+gy+'" class="grid-line"/>';
    }
    var xlabels = "";
    months.forEach(function(m,i){
      var x = padL + i*stepX;
      xlabels += '<text x="'+x+'" y="'+(h-10)+'" text-anchor="middle" class="axis-label">'+m+'</text>';
    });
    var lines = "";
    series.forEach(function(s){
      var pts = s.values.map(function(v,i){
        var x = padL + i*stepX;
        var y = padT + chartH - (v/maxVal)*chartH;
        return x+","+y;
      }).join(" ");
      lines += '<polyline points="'+pts+'" fill="none" stroke="'+s.color+'" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="square" filter="url(#lineGlow)"/>';
      s.values.forEach(function(v,i){
        var x = padL + i*stepX;
        var y = padT + chartH - (v/maxVal)*chartH;
        var diamond = 'M'+x+','+(y-5)+' L'+(x+5)+','+y+' L'+x+','+(y+5)+' L'+(x-5)+','+y+' Z';
        lines += '<path d="'+diamond+'" fill="'+s.color+'" filter="url(#lineGlow)"/>';
      });
    });
    return '<svg viewBox="0 0 '+w+' '+h+'" class="chart-svg line" preserveAspectRatio="none">'+defs+grid+lines+xlabels+'</svg>';
  }

  function render(){
    var now = new Date();
    var todayY = now.getFullYear(), todayM = now.getMonth(), todayD = now.getDate();
    var todayOnly = new Date(todayY, todayM, todayD).getTime();
    var todayKey = keyFor(todayY, todayM, todayD);

    var yearOptions = [];
    for(var y = todayY - 5; y <= todayY + 1; y++) yearOptions.push(y);

    var todayDoneCount = topics.filter(function(t){ return checks[t.id] && checks[t.id][todayKey]; }).length;
    var todayPct = topics.length ? Math.round((todayDoneCount/topics.length)*100) : 0;

    var html = "";

    // header
    html += '<div class="header">';
    html += '  <div>';
    html += '    <h1 class="title">Daily <span>Ledger</span></h1>';
    html += '    <div class="title-rule"></div>';
    html += '    <div class="subtitle mono">' + (view==="month"
              ? (MONTH_NAMES[todayM].toUpperCase()+" "+todayD+", "+todayY)
              : ("YEAR "+selYear+" OVERVIEW")) + '</div>';
    if(view==="month" && topics.length>0){
      html += '    <div class="progress-row">';
      html += '      <div class="progress-track"><div class="progress-fill" style="width:'+todayPct+'%"></div></div>';
      html += '      <span class="progress-text mono">'+todayDoneCount+'/'+topics.length+' Completed</span>';
      html += '    </div>';
    }
    html += '  </div>';

    if(view === "month"){
      html += '  <div class="select-row">';
      html += '    <select id="monthSelect">';
      MONTH_NAMES.forEach(function(m,i){
        html += '<option value="'+i+'"'+(i===selMonth?' selected':'')+'>'+m.toUpperCase()+'</option>';
      });
      html += '    </select>';
      html += '    <select id="yearSelect">';
      yearOptions.forEach(function(yy){
        html += '<option value="'+yy+'"'+(yy===selYear?' selected':'')+'>'+yy+'</option>';
      });
      html += '    </select>';
      html += '  </div>';
    } else {
      html += '  <select id="yearSelectAnnual">';
      yearOptions.forEach(function(yy){
        html += '<option value="'+yy+'"'+(yy===selYear?' selected':'')+'>'+yy+'</option>';
      });
      html += '  </select>';
    }
    html += '</div>';

    // actions
    html += '<div class="actions">';
    if(view === "month"){
      html += '<button class="btn cut-sm'+(showAdd?' active':'')+'" data-action="toggle-add">+ Scribe New Lore</button>';
    }
    html += '<button class="btn cut-sm'+(view==="year"?' active':'')+'" data-action="toggle-view">'+(view==="year"?'\u2261 Return to Realm':'\u25A4 Grand Chronicle')+'</button>';
    if(syncWarning){
      html += '<span class="warn">RITUAL FAILED \u2014 changes may not bind to the server.</span>';
    }
    html += '</div>';

    if(loadError){
      html += '<div class="warn" style="display:block;margin-bottom:16px;">'+escapeHtml(loadError)+'</div>';
    }

    // add form
    if(showAdd && view === "month"){
      html += '<div class="add-form cut">';
      html += '  <input id="newTopicInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="NAME OF QUEST \u2014 TRAINING, CRAFTING, MERCHANTRY..." />';
      html += '  <button class="btn cut-sm primary" data-action="submit-add">\u2713 Forge</button>';
      html += '  <button class="btn cut-sm" data-action="cancel-add">\u2715 Abandon</button>';
      html += '</div>';
    }

    if(topics.length === 0){
      html += '<div class="empty">';
      html += '  <div class="big">The Ledger is Barren</div>';
      html += '  <div class="small mono">INSCRIBE A QUEST TO BEGIN YOUR JOURNEY</div>';
      html += '</div>';
    }

    if(topics.length > 0 && view === "month"){
      var numDays = daysInMonth(selYear, selMonth);
      var dayList = [];
      for(var d=1; d<=numDays; d++) dayList.push(d);

      // bar chart data
      var barData = topics.map(function(t,i){
        var count = 0;
        dayList.forEach(function(d){
          var k = keyFor(selYear, selMonth, d);
          if(checks[t.id] && checks[t.id][k]) count++;
        });
        return { name: t.name, count: count, fill: colorFor(i) };
      });

      html += '<div class="panel cut">' + buildBarChartSVG(barData) + '</div>';

      // table
      html += '<div class="table-wrap"><table><thead><tr>';
      html += '<th class="list-head">Quests</th>';
      dayList.forEach(function(d){
        var weekend = isWeekend(selYear, selMonth, d);
        var status = cellStatus(selYear, selMonth, d, todayOnly);
        var cls = status==="today" ? "today-col" : (weekend ? "weekend" : "");
        html += '<th class="'+cls+'"><div>'+d+'</div><div style="font-size:10px;opacity:.8">'+weekdayLetter(selYear, selMonth, d)+'</div></th>';
      });
      html += '</tr></thead><tbody>';

      topics.forEach(function(topic, ti){
        html += '<tr>';
        html += '<td class="name-cell"><div class="name-row">';
        html += '<span class="name-dot" style="background:'+colorFor(ti)+';box-shadow:0 0 10px '+colorFor(ti)+'"></span>';
        html += '<span class="name-text" style="color:'+colorFor(ti)+'">'+escapeHtml(topic.name)+'</span>';
        html += '<button class="del-btn" data-action="delete-topic" data-id="'+topic.id+'" data-name="'+escapeHtml(topic.name)+'" aria-label="Delete">';
        html += '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
        html += '</button>';
        html += '</div></td>';

        dayList.forEach(function(d){
          var status = cellStatus(selYear, selMonth, d, todayOnly);
          var key = keyFor(selYear, selMonth, d);
          var checked = !!(checks[topic.id] && checks[topic.id][key]);
          var weekend = isWeekend(selYear, selMonth, d);
          html += '<td class="day-cell'+(weekend?' weekend':'')+'">';
          if(status === "today"){
            html += '<button class="cell-today'+(checked?' checked':'')+'" data-action="toggle-check" data-id="'+topic.id+'" data-key="'+key+'" aria-label="Toggle">';
            if(checked) html += '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#05020a" stroke-width="4"><polyline points="20 6 9 17 4 12"/></svg>';
            html += '</button>';
          } else if(status === "future"){
            html += '<div class="cell-future"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>';
          } else {
            html += '<div class="cell-past'+(checked?' checked':'')+'" style="'+(checked ? ('background:'+colorFor(ti)+';box-shadow:0 0 15px '+colorFor(ti)) : '')+'">';
            if(checked) html += '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#05020a" stroke-width="4"><polyline points="20 6 9 17 4 12"/></svg>';
            html += '</div>';
          }
          html += '</td>';
        });
        html += '</tr>';
      });

      html += '</tbody></table></div>';
      html += '<div class="foot-note">ONLY TODAY MAY BE ALTERED. THE PAST IS WRITTEN IN STONE \u2014 THE FUTURE REMAINS SHROUDED.</div>';
    }

    if(topics.length > 0 && view === "year"){
      var annualSeries = topics.map(function(t,i){
        var values = MONTH_SHORT.map(function(mn, mi){
          var dim = daysInMonth(selYear, mi);
          var count = 0;
          for(var dd=1; dd<=dim; dd++){
            var k = keyFor(selYear, mi, dd);
            if(checks[t.id] && checks[t.id][k]) count++;
          }
          return count;
        });
        return { name: t.name, color: colorFor(i), values: values };
      });

      html += '<div class="panel cut">';
      html += buildLineChartSVG(MONTH_SHORT, annualSeries);
      html += '<div class="legend">';
      annualSeries.forEach(function(s){
        html += '<div class="legend-item"><span class="legend-dot" style="background:'+s.color+'"></span>'+escapeHtml(s.name)+'</div>';
      });
      html += '</div>';
      html += '<div class="foot-note">EACH THREAD TRACKS VICTORIES PER CYCLE ACROSS '+selYear+'.</div>';
      html += '</div>';
    }

    document.getElementById("app").innerHTML = html;

    if(showAdd){
      var inp = document.getElementById("newTopicInput");
      if(inp) inp.focus();
    }
  }

  document.addEventListener("DOMContentLoaded", function(){
    var app = document.getElementById("app");
    app.innerHTML = '<div class="foot-note mono" style="padding:40px;text-align:center;">SUMMONING THE LEDGER\u2026</div>';

    app.addEventListener("click", function(e){
      var el = e.target.closest("[data-action]");
      if(!el) return;
      var action = el.dataset.action;
      if(action === "toggle-add"){ showAdd = !showAdd; render(); }
      else if(action === "toggle-view"){ view = (view === "month") ? "year" : "month"; render(); }
      else if(action === "cancel-add"){ showAdd = false; render(); }
      else if(action === "submit-add"){
        var input = document.getElementById("newTopicInput");
        addTopic(input ? input.value : "");
      }
      else if(action === "delete-topic"){ deleteTopic(el.dataset.id, el.dataset.name); }
      else if(action === "toggle-check"){
        var now = new Date();
        var todayKey = keyFor(now.getFullYear(), now.getMonth(), now.getDate());
        toggleCheck(el.dataset.id, el.dataset.key, todayKey);
      }
    });

    app.addEventListener("change", function(e){
      if(e.target.id === "monthSelect"){ selMonth = Number(e.target.value); render(); }
      else if(e.target.id === "yearSelect"){ selYear = Number(e.target.value); render(); }
      else if(e.target.id === "yearSelectAnnual"){ selYear = Number(e.target.value); render(); }
    });

    app.addEventListener("keydown", function(e){
      if(e.target.id === "newTopicInput"){
        if(e.key === "Enter") addTopic(e.target.value);
        if(e.key === "Escape"){ showAdd = false; render(); }
      }
    });

    loadData().then(function(){
      try{
        render();
      }catch(err){
        app.innerHTML = '<div style="max-width:640px;margin:60px auto;padding:24px;border:1px solid var(--accent-bright);background:var(--panel);color:var(--white);font-family:\'JetBrains Mono\',monospace;font-size:13px;white-space:pre-wrap;box-shadow:0 0 30px rgba(255,204,77,0.2);">CATACLYSM ERROR:\n' + (err && err.stack ? err.stack : err) + '</div>';
      }
    });
  });
})();
</script>
</body>
</html>
