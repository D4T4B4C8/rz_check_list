<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Ledger - Cinematic Edition</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=JetBrains+Mono:wght@400;700&display=swap');

  :root {
    /* Matte charcoal grey base with deep emerald green accents */
    --bg: #121212;
    --bg-texture: #1a1a1a;
    --panel: #1e1e1e;
    --panel-alt: #161616;
    --hair: #2d2d2d;
    --white: #e5e7eb;
    --dim: #9ca3af;
    
    --accent: #047857; /* Deep Emerald */
    --accent-bright: #10b981;
    --accent-dim: #064e3b;
    --accent-glow: rgba(16, 185, 129, 0.45);
    --accent-glow-soft: rgba(16, 185, 129, 0.15);
    
    --gray: #4b5563;
    /* Comic book style heavy shadows */
    --shadow-heavy: 6px 6px 0px #000000, 0 0 30px rgba(0,0,0,0.8);
    --shadow-glow: 0 0 15px var(--accent-glow), inset 0 0 10px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }

  html { background: var(--bg); }

  body {
    margin: 0;
    position: relative;
    background-color: var(--bg);
    /* Atmospheric matte painting gradients and charcoal texture */
    background-image:
      radial-gradient(ellipse 1500px 900px at 50% 0%, var(--accent-glow-soft), transparent 70%),
      radial-gradient(ellipse 800px 600px at 100% 100%, rgba(255,255,255,0.02), transparent 50%),
      repeating-linear-gradient(45deg, #111 0px, #111 2px, transparent 2px, transparent 8px),
      repeating-linear-gradient(-45deg, #151515 0px, #151515 2px, transparent 2px, transparent 8px);
    color: var(--white);
    font-family: 'Cinzel', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Vignette / dramatic lighting overlay */
  body::after {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    box-shadow: inset 0 0 300px rgba(0,0,0,0.95);
    background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.7) 100%);
  }

  .mono { font-family: 'JetBrains Mono', monospace; font-weight: 700; }

  #app { position: relative; z-index: 2; max-width: 1900px; width: 100%; margin: 0 auto; padding: 40px clamp(16px,4vw,60px); }

  /* Intricate comic panel cuts */
  .cut { clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px); }
  .cut-sm { clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }

  .header {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
    gap: 20px; margin-bottom: 35px; padding-bottom: 25px; 
    border-bottom: 3px solid var(--accent-dim);
    position: relative;
    box-shadow: 0 10px 20px -10px rgba(0,0,0,0.8);
  }
  
  .title {
    font-size: clamp(42px, 5vw, 64px); font-weight: 800; text-transform: uppercase; letter-spacing: 0.15em;
    text-shadow: 2px 2px 0px #000, 0 0 40px var(--accent-glow); margin: 0; line-height: 1;
  }
  .title span { color: var(--accent-bright); text-shadow: 2px 2px 0px #000, 0 0 20px var(--accent-bright); }
  
  .title-rule {
    width: 120px; height: 4px; margin-top: 15px; 
    background: linear-gradient(90deg, var(--accent-bright), transparent);
    box-shadow: 0 0 15px var(--accent-glow);
  }
  .subtitle { font-size: 14px; color: var(--dim); letter-spacing: 0.2em; margin-top: 15px; text-shadow: 1px 1px 0px #000; }

  .progress-row { display: flex; align-items: center; gap: 15px; margin-top: 15px; }
  .progress-track { 
    width: 200px; height: 10px; background: #000; 
    border: 1px solid var(--accent-dim); 
    box-shadow: inset 2px 2px 5px rgba(0,0,0,0.8); 
  }
  .progress-fill { 
    height: 100%; background: linear-gradient(90deg, var(--accent-dim), var(--accent-bright)); 
    box-shadow: 0 0 15px var(--accent-glow); transition: width .5s cubic-bezier(0.4, 0, 0.2, 1); 
  }
  .progress-text { font-size: 14px; color: var(--accent-bright); letter-spacing: 0.1em; text-shadow: 1px 1px 0 #000; }

  select {
    appearance: none; -webkit-appearance: none; 
    background-color: var(--panel); color: var(--white);
    border: 2px solid var(--accent-dim); padding: 12px 20px; font-size: 13px; letter-spacing: 0.1em;
    font-family: 'JetBrains Mono', monospace; font-weight: 700; cursor: pointer; 
    box-shadow: 4px 4px 0px #000;
    text-transform: uppercase;
    transition: all .2s ease;
  }
  select:hover { border-color: var(--accent-bright); box-shadow: 6px 6px 0px #000, 0 0 20px var(--accent-glow); transform: translate(-2px, -2px); }
  select option { background: var(--bg-texture); color: var(--white); font-weight: 700; }
  .select-row { display: flex; gap: 12px; }

  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 30px; }
  button { cursor: pointer; font-family: inherit; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800;
    padding: 12px 24px; text-transform: uppercase; letter-spacing: 0.1em;
    background: var(--panel); color: var(--white); 
    border: 2px solid var(--accent-dim);
    box-shadow: 4px 4px 0px #000;
    transition: all .2s cubic-bezier(0.4, 0, 0.2, 1);
    text-shadow: 1px 1px 0px #000;
  }
  .btn:hover { 
    box-shadow: 6px 6px 0px #000, 0 0 25px var(--accent-glow); 
    transform: translate(-2px, -2px); border-color: var(--accent-bright); 
  }
  .btn:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px #000; }
  .btn.active, .btn.primary { 
    background: linear-gradient(135deg, var(--accent-bright), var(--accent)); 
    color: #000; border-color: var(--accent-bright); text-shadow: none;
  }

  .warn { font-size: 13px; color: var(--accent-bright); font-family: 'JetBrains Mono', monospace; text-shadow: 0 0 10px var(--accent-glow); background: rgba(0,0,0,0.5); padding: 5px 10px; border-left: 3px solid var(--accent-bright); }

  .add-form {
    display: flex; align-items: center; gap: 12px; margin-bottom: 30px; padding: 18px;
    background: var(--panel-alt); border: 2px solid var(--accent-dim); 
    box-shadow: var(--shadow-heavy);
  }
  .add-form input {
    flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; padding: 12px 18px;
    background: #000; border: 1px solid var(--accent-dim); color: var(--white); outline: none; letter-spacing: 0.05em;
    box-shadow: inset 2px 2px 5px rgba(0,0,0,0.8);
    transition: all .2s ease;
  }
  .add-form input:focus { border-color: var(--accent-bright); box-shadow: inset 2px 2px 5px rgba(0,0,0,0.8), 0 0 15px var(--accent-glow); }
  .add-form input::placeholder { color: var(--gray); }

  .empty {
    text-align: center; padding: 80px 20px; border: 2px dashed var(--accent-dim); color: var(--dim); margin-bottom: 30px;
    background: radial-gradient(ellipse at center, var(--accent-glow-soft), transparent 60%);
    box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
  }
  .empty .big { font-size: 28px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.2em; color: var(--white); margin-bottom: 12px; text-shadow: 0 0 25px var(--accent-glow); }
  .empty .small { font-size: 13px; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.05em; }

  .panel { 
    background: var(--panel); border: 2px solid var(--hair); padding: 25px; margin-bottom: 35px; 
    box-shadow: var(--shadow-heavy); position: relative; overflow: hidden;
  }
  .panel::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.1) 10px, rgba(0,0,0,0.1) 20px);
  }

  .chart-svg { width: 100%; display: block; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5)); }
  .chart-svg.bar { height: clamp(220px, 28vw, 300px); }
  .chart-svg.line { height: clamp(280px, 36vw, 420px); }
  .grid-line { stroke: var(--hair); stroke-width: 2; stroke-dasharray: 4 4; }
  .axis-label { fill: var(--dim); font-size: 12px; font-weight: 700; font-family: 'JetBrains Mono', monospace; text-shadow: 1px 1px 0 #000; }
  .bar-value { fill: var(--white); font-size: 13px; font-weight: 700; font-family: 'JetBrains Mono', monospace; text-shadow: 0 0 8px #000; }

  .legend { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 15px; position: relative; z-index: 2; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--white); text-shadow: 1px 1px 0 #000; }
  .legend-dot { width: 12px; height: 12px; flex-shrink: 0; border: 1px solid #000; box-shadow: 2px 2px 0 rgba(0,0,0,0.8); }

  .table-wrap {
    overflow-x: auto; background: var(--panel-alt); border: 2px solid var(--accent-dim); box-shadow: var(--shadow-heavy);
    width: 100%; position: relative;
  }
  table { border-collapse: collapse; width: 100%; min-width: 860px; table-layout: fixed; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
  th, td { white-space: nowrap; }
  th.list-head, td.name-cell { white-space: normal; font-family: 'Cinzel', serif; }
  thead th {
    text-align: center; font-weight: 700; padding: 12px 6px; font-size: 12px;
    border-left: 2px solid #000; border-bottom: 2px solid #000; color: var(--dim);
    background: #111; text-shadow: 1px 1px 0 #000;
  }
  thead th.weekend { background: #0a0a0a; }
  thead th.today-col { background: var(--accent-dim); color: var(--white); border-bottom: 2px solid var(--accent-bright); box-shadow: inset 0 0 20px rgba(16,185,129,0.2); }
  thead .list-head {
    position: sticky; left: 0; z-index: 3; text-align: left; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.1em; padding: 15px 15px 15px 25px; border-right: 3px solid var(--accent); background: #000;
    color: var(--white); width: 220px; box-shadow: 6px 0 15px rgba(0,0,0,0.8); font-size: 16px;
  }
  tbody td.name-cell {
    position: sticky; left: 0; z-index: 3; background: #111; border-right: 3px solid var(--accent);
    border-top: 1px solid var(--hair); padding: 12px 15px 12px 25px;
    box-shadow: 6px 0 15px rgba(0,0,0,0.8);
  }
  tbody td.day-cell { text-align: center; padding: 10px 4px; border-left: 1px solid var(--hair); border-top: 1px solid var(--hair); background: var(--panel-alt); }
  tbody td.day-cell.weekend { background: #0f0f0f; }
  tbody tr:hover td.day-cell { background: rgba(16, 185, 129, 0.08); }
  tbody tr:hover td.day-cell.weekend { background: rgba(16, 185, 129, 0.12); }

  .name-row { display: flex; align-items: flex-start; gap: 12px; }
  .name-dot { width: 12px; height: 12px; flex-shrink: 0; border: 1px solid #000; margin-top: 4px; box-shadow: 2px 2px 0 #000; }
  .name-text { font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: 0.05em; word-break: break-word; overflow-wrap: break-word; min-width: 0; flex: 1; text-shadow: 1px 1px 0 #000; }
  .del-btn { margin-left: 4px; margin-top: 2px; flex-shrink: 0; opacity: 0.3; background: none; border: none; color: var(--white); display: flex; align-items: center; transition: all .2s ease; cursor: pointer; }
  .del-btn:hover { opacity: 1; color: var(--accent-bright); filter: drop-shadow(0 0 5px var(--accent-bright)); }

  .cell-today {
    width: 28px; height: 28px; border: 2px solid var(--accent-bright); background: #000; display: flex;
    align-items: center; justify-content: center; margin: 0 auto; transition: all .2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: inset 0 0 10px rgba(16,185,129,0.2), 0 0 15px var(--accent-glow-soft);
    cursor: pointer;
  }
  .cell-today:hover { background: var(--accent-dim); box-shadow: 0 0 20px var(--accent-glow); transform: scale(1.15) rotate(5deg); }
  .cell-today.checked { background: var(--accent-bright); border-color: #fff; box-shadow: 0 0 25px var(--accent-bright), inset 0 0 10px rgba(0,0,0,0.5); transform: scale(1.1); }

  .cell-future {
    width: 28px; height: 28px; border: 2px dotted #333; display: flex; align-items: center;
    justify-content: center; margin: 0 auto; color: #444; background: #0a0a0a;
  }
  .cell-past {
    width: 28px; height: 28px; border: 2px solid #222; display: flex; align-items: center;
    justify-content: center; margin: 0 auto; opacity: 0.4; background: #111;
  }
  .cell-past.checked { opacity: 1; border-width: 2px; box-shadow: 2px 2px 0px #000; }

  .foot-note { font-size: 12px; color: var(--dim); font-family: 'JetBrains Mono', monospace; font-weight: 700; letter-spacing: 0.05em; margin-top: 20px; text-shadow: 1px 1px 0 #000; text-align: center; }

  @media (max-width: 768px) {
    .header { flex-direction: column; align-items: flex-start; }
    thead .list-head, tbody td.name-cell { width: 160px; padding-left: 15px; }
    .actions { flex-direction: column; align-items: stretch; }
  }

  /* ===== Theme Switcher ===== */
  .theme-switcher{
    position:fixed; top:14px; right:14px; z-index:9999;
    display:flex; gap:8px; padding:8px;
    background:rgba(0,0,0,0.55); border:1px solid rgba(255,255,255,0.18);
    border-radius:30px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .theme-dot{
    width:18px; height:18px; border-radius:50%; display:block;
    border:2px solid rgba(255,255,255,0.3); box-sizing:border-box;
    text-decoration:none; transition:transform .2s ease, border-color .2s ease;
  }
  .theme-dot:hover{ transform:scale(1.25); border-color:#fff; }
  .theme-dot.active{ border-color:#fff; box-shadow:0 0 10px currentColor; transform:scale(1.15); pointer-events:none; cursor:default; }
  @media (max-width:520px){
    .theme-switcher{ top:8px; right:8px; padding:6px; gap:6px; }
    .theme-dot{ width:14px; height:14px; }
  }
</style>
</head>
<body>
<div class="theme-switcher" role="navigation" aria-label="Switch theme">

  <a href="i4.html" class="theme-dot active" style="background:#10b981" title="Cinematic Emerald"></a>
  <a href="i5.html" class="theme-dot" style="background:#00e5ff" title="Cyberpunk 2099"></a>
  <a href="i6.html" class="theme-dot" style="background:#ff2a4b" title="Studio Trigger"></a>
</div>
<div id="app"></div>

<script>
(function(){
  "use strict";

  var API_URL = "/api/data";
  // Updated PALETTE: Emerald greens, charcoal grays, deep teals to match the cinematic/matte art style
  var PALETTE = ["#047857", "#10b981", "#34d399", "#064e3b", "#0f766e", "#14b8a6", "#2dd4bf", "#134e4a"];
  var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var MONTH_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  var topics = [];
  var checks = {};
  var view = "month";
  var showAdd = false;
  var syncWarning = false;
  var loadError = "";

  var now0 = new Date();
  var selMonth = now0.getMonth();
  var selYear = now0.getFullYear();

  function colorFor(i){ return PALETTE[i % PALETTE.length]; }
  function pad2(n){ return String(n).padStart(2,"0"); }
  function keyFor(y,m,d){ return y+"-"+pad2(m+1)+"-"+pad2(d); }
  function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
  function weekdayLetter(y,m,d){ return new Date(y,m,d).toLocaleDateString("en-US",{weekday:"narrow"}); }
  function isWeekend(y,m,d){ var day = new Date(y,m,d).getDay(); return day===0 || day===6; }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  async function loadData(){
    try{
      var res = await fetch(API_URL + "?t=" + Date.now(), { cache: "no-store" });
      if(!res.ok) throw new Error("Server returned " + res.status);
      var state = await res.json();
      topics = Array.isArray(state.topics) ? state.topics : [];
      checks = (state.checks && typeof state.checks === "object") ? state.checks : {};
      loadError = "";
    }catch(e){
      console.error("loadData failed", e);
      topics = []; checks = {};
      loadError = "COMMUNICATION SEVERED. CHANGES WILL NOT BE PERSISTED.";
    }
  }

  async function persist(){
    try{
      var res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ topics: topics, checks: checks })
      });
      if(!res.ok) throw new Error("Server returned " + res.status);
      syncWarning = false;
    }catch(e){
      console.error("persist failed", e);
      syncWarning = true;
    }
    render();
  }

  function cellStatus(y,m,d,todayOnly){
    var t = new Date(y,m,d).getTime();
    if(t === todayOnly) return "today";
    return t > todayOnly ? "future" : "past";
  }

  function addTopic(name){
    name = (name||"").trim();
    if(!name) return;
    topics.push({ id: "t" + Date.now() + Math.floor(Math.random()*1000), name: name });
    render();
    persist();
  }

  function deleteTopic(id, name){
    var ok = window.confirm('ERASE "' + name + '" FROM EXISTENCE? THIS CANNOT BE UNDONE.');
    if(!ok) return;
    topics = topics.filter(function(t){ return t.id !== id; });
    delete checks[id];
    render();
    persist();
  }

  function toggleCheck(topicId, key, todayKey){
    if(key !== todayKey) return;
    if(!checks[topicId]) checks[topicId] = {};
    if(checks[topicId][key]) delete checks[topicId][key];
    else checks[topicId][key] = true;
    render();
    persist();
  }

  function buildBarChartSVG(data){
    var w = 900, h = 260, padL = 20, padR = 20, padT = 30, padB = 40;
    var chartW = w - padL - padR, chartH = h - padT - padB;
    var maxVal = Math.max(1, Math.max.apply(null, data.map(function(d){return d.count;})));
    var n = data.length || 1;
    var gap = 24;
    var barW = Math.max(24, (chartW / n) - gap);
    
    var defs = '<defs><filter id="glow" x="-60%" y="-60%" width="220%" height="220%">' +
      '<feGaussianBlur stdDeviation="4" result="blur"/>' +
      '<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>' +
      '</filter></defs>';
      
    data.forEach(function(d,i){
      defs += '<linearGradient id="barGrad'+i+'" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="'+d.fill+'" stop-opacity="1"/>' +
        '<stop offset="100%" stop-color="#000" stop-opacity="0.8"/>' +
        '</linearGradient>';
    });
    
    var grid = "";
    for(var g=0; g<=4; g++){
      var gy = padT + chartH - (g/4)*chartH;
      grid += '<line x1="'+padL+'" y1="'+gy+'" x2="'+(w-padR)+'" y2="'+gy+'" class="grid-line"/>';
    }
    
    var bars = "";
    data.forEach(function(d,i){
      var x = padL + i*(barW+gap) + gap/2;
      var barH = Math.max(2, (d.count/maxVal) * chartH);
      var y = padT + chartH - barH;
      var maxChars = Math.max(3, Math.floor(barW / 7));
      var label = d.name.length > maxChars ? (d.name.slice(0, Math.max(1,maxChars-1)) + "\u2026") : d.name;
      
      // Comic book heavy border for bars
      bars += '<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+barH+'" fill="#000" filter="url(#glow)"/>';
      bars += '<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+barH+'" rx="0" fill="url(#barGrad'+i+')" stroke="'+d.fill+'" stroke-width="2"/>';
      bars += '<text x="'+(x+barW/2)+'" y="'+(h-10)+'" text-anchor="middle" class="axis-label">'+escapeHtml(label)+(label!==d.name ? '<title>'+escapeHtml(d.name)+'</title>' : '')+'</text>';
      bars += '<text x="'+(x+barW/2)+'" y="'+(y-12)+'" text-anchor="middle" class="bar-value" style="fill:'+d.fill+'; filter: drop-shadow(0 0 4px '+d.fill+');">'+d.count+'</text>';
    });
    return '<svg viewBox="0 0 '+w+' '+h+'" class="chart-svg bar" preserveAspectRatio="none">'+defs+grid+bars+'</svg>';
  }

  function buildLineChartSVG(months, series){
    var w = 960, h = 360, padL = 30, padR = 30, padT = 20, padB = 40;
    var chartW = w - padL - padR, chartH = h - padT - padB;
    var allVals = series.reduce(function(acc,s){ return acc.concat(s.values); }, []);
    var maxVal = Math.max(1, Math.max.apply(null, allVals.length ? allVals : [0]));
    var stepX = chartW / Math.max(1, months.length - 1);
    
    var defs = '<defs><filter id="lineGlow" x="-60%" y="-60%" width="220%" height="220%">' +
      '<feGaussianBlur stdDeviation="3.5" result="blur"/>' +
      '<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>' +
      '</filter></defs>';
      
    var grid = "";
    for(var g=0; g<=4; g++){
      var gy = padT + chartH - (g/4)*chartH;
      grid += '<line x1="'+padL+'" y1="'+gy+'" x2="'+(w-padR)+'" y2="'+gy+'" class="grid-line"/>';
    }
    
    var xlabels = "";
    months.forEach(function(m,i){
      var x = padL + i*stepX;
      xlabels += '<text x="'+x+'" y="'+(h-12)+'" text-anchor="middle" class="axis-label">'+m+'</text>';
    });
    
    var lines = "";
    series.forEach(function(s){
      var pts = s.values.map(function(v,i){
        var x = padL + i*stepX;
        var y = padT + chartH - (v/maxVal)*chartH;
        return x+","+y;
      }).join(" ");
      // Double stroke for comic book effect
      lines += '<polyline points="'+pts+'" fill="none" stroke="#000" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>';
      lines += '<polyline points="'+pts+'" fill="none" stroke="'+s.color+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" filter="url(#lineGlow)"/>';
      
      s.values.forEach(function(v,i){
        var x = padL + i*stepX;
        var y = padT + chartH - (v/maxVal)*chartH;
        lines += '<circle cx="'+x+'" cy="'+y+'" r="5" fill="#000" stroke="'+s.color+'" stroke-width="2" filter="url(#lineGlow)"/>';
      });
    });
    return '<svg viewBox="0 0 '+w+' '+h+'" class="chart-svg line" preserveAspectRatio="none">'+defs+grid+lines+xlabels+'</svg>';
  }

  function render(){
    var now = new Date();
    var todayY = now.getFullYear(), todayM = now.getMonth(), todayD = now.getDate();
    var todayOnly = new Date(todayY, todayM, todayD).getTime();
    var todayKey = keyFor(todayY, todayM, todayD);

    var yearOptions = [];
    for(var y = todayY - 5; y <= todayY + 1; y++) yearOptions.push(y);

    var todayDoneCount = topics.filter(function(t){ return checks[t.id] && checks[t.id][todayKey]; }).length;
    var todayPct = topics.length ? Math.round((todayDoneCount/topics.length)*100) : 0;

    var html = "";

    // header
    html += '<div class="header">';
    html += '  <div>';
    html += '    <h1 class="title">Daily <span>Ledger</span></h1>';
    html += '    <div class="title-rule"></div>';
    html += '    <div class="subtitle mono">' + (view==="month"
              ? (MONTH_NAMES[todayM].toUpperCase()+" "+pad2(todayD)+", "+todayY)
              : ("YEAR "+selYear+" OVERVIEW")) + '</div>';
    if(view==="month" && topics.length>0){
      html += '    <div class="progress-row">';
      html += '      <div class="progress-track"><div class="progress-fill" style="width:'+todayPct+'%"></div></div>';
      html += '      <span class="progress-text mono">'+todayDoneCount+' / '+topics.length+'</span>';
      html += '    </div>';
    }
    html += '  </div>';

    if(view === "month"){
      html += '  <div class="select-row">';
      html += '    <select id="monthSelect">';
      MONTH_NAMES.forEach(function(m,i){
        html += '<option value="'+i+'"'+(i===selMonth?' selected':'')+'>'+m.toUpperCase()+'</option>';
      });
      html += '    </select>';
      html += '    <select id="yearSelect">';
      yearOptions.forEach(function(yy){
        html += '<option value="'+yy+'"'+(yy===selYear?' selected':'')+'>'+yy+'</option>';
      });
      html += '    </select>';
      html += '  </div>';
    } else {
      html += '  <select id="yearSelectAnnual">';
      yearOptions.forEach(function(yy){
        html += '<option value="'+yy+'"'+(yy===selYear?' selected':'')+'>'+yy+'</option>';
      });
      html += '  </select>';
    }
    html += '</div>';

    // actions
    html += '<div class="actions">';
    if(view === "month"){
      html += '<button class="btn cut-sm'+(showAdd?' active':'')+'" data-action="toggle-add">+ FORGE NEW TOPIC</button>';
    }
    html += '<button class="btn cut-sm'+(view==="year"?' active':'')+'" data-action="toggle-view">'+(view==="year"?'\u2261 RETURN TO ARCHIVE':'\u25A4 CHRONICLE GRAPH')+'</button>';
    if(syncWarning){
      html += '<span class="warn">CONNECTION LOST \u2014 DATA AT RISK</span>';
    }
    html += '</div>';

    if(loadError){
      html += '<div class="warn" style="display:block;margin-bottom:20px;">'+escapeHtml(loadError)+'</div>';
    }

    // add form
    if(showAdd && view === "month"){
      html += '<div class="add-form cut">';
      html += '  <input id="newTopicInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="ENTER TOPIC DIRECTIVE..." />';
      html += '  <button class="btn cut-sm primary" data-action="submit-add">\u2713 COMMIT</button>';
      html += '  <button class="btn cut-sm" data-action="cancel-add">\u2715 ABORT</button>';
      html += '</div>';
    }

    if(topics.length === 0){
      html += '<div class="empty">';
      html += '  <div class="big">THE ARCHIVE LIES EMPTY</div>';
      html += '  <div class="small mono">INITIALIZE A TOPIC TO BEGIN RECORDING</div>';
      html += '</div>';
    }

    if(topics.length > 0 && view === "month"){
      var numDays = daysInMonth(selYear, selMonth);
      var dayList = [];
      for(var d=1; d<=numDays; d++) dayList.push(d);

      // bar chart data
      var barData = topics.map(function(t,i){
        var count = 0;
        dayList.forEach(function(d){
          var k = keyFor(selYear, selMonth, d);
          if(checks[t.id] && checks[t.id][k]) count++;
        });
        return { name: t.name, count: count, fill: colorFor(i) };
      });

      html += '<div class="panel cut">' + buildBarChartSVG(barData) + '</div>';

      // table
      html += '<div class="table-wrap"><table><thead><tr>';
      html += '<th class="list-head">DIRECTIVE</th>';
      dayList.forEach(function(d){
        var weekend = isWeekend(selYear, selMonth, d);
        var status = cellStatus(selYear, selMonth, d, todayOnly);
        var cls = status==="today" ? "today-col" : (weekend ? "weekend" : "");
        html += '<th class="'+cls+'"><div>'+pad2(d)+'</div><div style="font-size:10px; opacity:.6; margin-top:2px;">'+weekdayLetter(selYear, selMonth, d)+'</div></th>';
      });
      html += '</tr></thead><tbody>';

      topics.forEach(function(topic, ti){
        html += '<tr>';
        html += '<td class="name-cell"><div class="name-row">';
        html += '<span class="name-dot" style="background:'+colorFor(ti)+'; border-color:'+colorFor(ti)+'"></span>';
        html += '<span class="name-text" style="color:'+colorFor(ti)+'">'+escapeHtml(topic.name)+'</span>';
        html += '<button class="del-btn" data-action="delete-topic" data-id="'+topic.id+'" data-name="'+escapeHtml(topic.name)+'" aria-label="Delete">';
        html += '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';
        html += '</button>';
        html += '</div></td>';

        dayList.forEach(function(d){
          var status = cellStatus(selYear, selMonth, d, todayOnly);
          var key = keyFor(selYear, selMonth, d);
          var checked = !!(checks[topic.id] && checks[topic.id][key]);
          var weekend = isWeekend(selYear, selMonth, d);
          html += '<td class="day-cell'+(weekend?' weekend':'')+'">';
          
          if(status === "today"){
            html += '<button class="cell-today'+(checked?' checked':'')+'" data-action="toggle-check" data-id="'+topic.id+'" data-key="'+key+'" aria-label="Toggle">';
            if(checked) html += '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="4"><polyline points="20 6 9 17 4 12"/></svg>';
            html += '</button>';
          } else if(status === "future"){
            html += '<div class="cell-future"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>';
          } else {
            html += '<div class="cell-past'+(checked?' checked':'')+'" style="'+(checked ? ('border-color:'+colorFor(ti)+';background:'+colorFor(ti)) : '')+'">';
            if(checked) html += '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';
            html += '</div>';
          }
          html += '</td>';
        });
        html += '</tr>';
      });

      html += '</tbody></table></div>';
      html += '<div class="foot-note">ONLY THE PRESENT CAN BE ALTERED. THE PAST IS SEALED IN INK \u2014 THE FUTURE REMAINS UNWRITTEN.</div>';
    }

    if(topics.length > 0 && view === "year"){
      var annualSeries = topics.map(function(t,i){
        var values = MONTH_SHORT.map(function(mn, mi){
          var dim = daysInMonth(selYear, mi);
          var count = 0;
          for(var dd=1; dd<=dim; dd++){
            var k = keyFor(selYear, mi, dd);
            if(checks[t.id] && checks[t.id][k]) count++;
          }
          return count;
        });
        return { name: t.name, color: colorFor(i), values: values };
      });

      html += '<div class="panel cut">';
      html += buildLineChartSVG(MONTH_SHORT, annualSeries);
      html += '<div class="legend">';
      annualSeries.forEach(function(s){
        html += '<div class="legend-item"><span class="legend-dot" style="background:'+s.color+'"></span>'+escapeHtml(s.name)+'</div>';
      });
      html += '</div>';
      html += '<div class="foot-note">TRACKING CONSTANCY ACROSS THE CHRONICLES OF '+selYear+'.</div>';
      html += '</div>';
    }

    document.getElementById("app").innerHTML = html;

    if(showAdd){
      var inp = document.getElementById("newTopicInput");
      if(inp) inp.focus();
    }
  }

  document.addEventListener("DOMContentLoaded", function(){
    var app = document.getElementById("app");
    app.innerHTML = '<div class="foot-note mono" style="padding:60px;text-align:center;font-size:18px;">ESTABLISHING LINK TO ARCHIVE...</div>';

    app.addEventListener("click", function(e){
      var el = e.target.closest("[data-action]");
      if(!el) return;
      var action = el.dataset.action;
      if(action === "toggle-add"){ showAdd = !showAdd; render(); }
      else if(action === "toggle-view"){ view = (view === "month") ? "year" : "month"; render(); }
      else if(action === "cancel-add"){ showAdd = false; render(); }
      else if(action === "submit-add"){
        var input = document.getElementById("newTopicInput");
        addTopic(input ? input.value : "");
      }
      else if(action === "delete-topic"){ deleteTopic(el.dataset.id, el.dataset.name); }
      else if(action === "toggle-check"){
        var now = new Date();
        var todayKey = keyFor(now.getFullYear(), now.getMonth(), now.getDate());
        toggleCheck(el.dataset.id, el.dataset.key, todayKey);
      }
    });

    app.addEventListener("change", function(e){
      if(e.target.id === "monthSelect"){ selMonth = Number(e.target.value); render(); }
      else if(e.target.id === "yearSelect"){ selYear = Number(e.target.value); render(); }
      else if(e.target.id === "yearSelectAnnual"){ selYear = Number(e.target.value); render(); }
    });

    app.addEventListener("keydown", function(e){
      if(e.target.id === "newTopicInput"){
        if(e.key === "Enter") addTopic(e.target.value);
        if(e.key === "Escape"){ showAdd = false; render(); }
      }
    });

    loadData().then(function(){
      try{
        render();
      }catch(err){
        app.innerHTML = '<div style="max-width:800px;margin:80px auto;padding:30px;border:2px solid var(--accent-bright);background:#000;color:var(--accent-bright);font-family:\'JetBrains Mono\',monospace;font-size:14px;white-space:pre-wrap;box-shadow:8px 8px 0 #000, 0 0 30px rgba(16,185,129,0.3);">CRITICAL RENDER FAILURE:\n\n' + (err && err.stack ? err.stack : err) + '</div>';
      }
    });
  });
})();
</script>
</body>
</html>
