<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Ledger</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap');

  :root {
    /* Cinematic Color Grading */
    --bg-base: #0f1115;
    --panel: rgba(18, 22, 28, 0.85);
    --panel-alt: rgba(25, 32, 40, 0.95);
    --hair: #2c3542;
    --white: #e2e8f0;
    --dim: #718096;
    
    /* Dramatic Lighting & Accents */
    --accent: #ff8c42; /* Cinematic Amber */
    --accent-glow: rgba(255, 140, 66, 0.6);
    --accent-dim: rgba(255, 140, 66, 0.15);
    
    /* Comic Book / Illustration Styles */
    --ink-border: 2px solid #000;
    --shadow-epic: 0 30px 60px rgba(0,0,0,0.9), inset 0 1px 1px rgba(255,255,255,0.07);
  }

  * { box-sizing: border-box; }

  html { background: var(--bg-base); }

  body {
    margin: 0;
    position: relative;
    background-color: var(--bg-base);
    /* Cinematic Lighting: Matte charcoal and deep emerald green ambient glows */
    background-image:
      radial-gradient(ellipse 1400px 900px at 20% -10%, rgba(12, 60, 45, 0.25), transparent 60%),
      radial-gradient(ellipse 1200px 800px at 90% 110%, rgba(40, 45, 55, 0.4), transparent 55%);
    color: var(--white);
    font-family: 'Oswald', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 35mm Film Grain (v-raptor XL aesthetic) */
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 99;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
    mix-blend-mode: overlay;
  }

  /* Dramatic Vignette */
  body::after {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 98;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, rgba(0,0,0,0.9) 100%);
  }

  .mono { font-family: 'JetBrains Mono', monospace; }

  #app { 
    position: relative; z-index: 2; max-width: 1900px; width: 100%; 
    margin: 0 auto; padding: 40px clamp(20px, 5vw, 60px) 100px; 
  }

  .header {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
    gap: 20px; margin-bottom: 35px; padding-bottom: 25px; 
    border-bottom: var(--ink-border); position: relative;
  }
  
  .header::after {
    content: ""; position: absolute; bottom: 0; left: 0; width: 100%; height: 1px;
    background: rgba(255,255,255,0.05);
  }

  .title {
    font-size: clamp(40px, 5vw, 65px); font-weight: 700; text-transform: uppercase; 
    letter-spacing: 0.05em; line-height: 1; margin: 0;
    text-shadow: 2px 2px 0 #000, 4px 4px 0px rgba(0,0,0,0.5), 0 0 40px var(--accent-glow);
  }
  
  .title span { color: var(--accent); }
  
  .title-rule {
    width: 100px; height: 4px; margin-top: 15px; 
    background: linear-gradient(90deg, var(--accent), transparent);
    box-shadow: 0 0 15px var(--accent-glow);
    border: 1px solid #000; border-right: none;
  }
  
  .subtitle { font-size: 14px; color: var(--dim); letter-spacing: 0.1em; margin-top: 15px; text-transform: uppercase; }

  .progress-row { display: flex; align-items: center; gap: 12px; margin-top: 15px; }
  .progress-track { 
    width: 200px; height: 10px; background: #000; 
    border: 1px solid rgba(255,255,255,0.1); box-shadow: inset 0 2px 5px rgba(0,0,0,1); 
  }
  .progress-fill { 
    height: 100%; background: var(--accent); 
    box-shadow: 0 0 15px var(--accent-glow); transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); 
  }
  .progress-text { font-size: 13px; color: var(--accent); letter-spacing: 0.05em; text-shadow: 0 0 5px var(--accent-glow); }

  select {
    appearance: none; -webkit-appearance: none; background-color: #000; color: var(--white);
    border: var(--ink-border); border-color: var(--hair); padding: 12px 18px; font-size: 13px; 
    letter-spacing: 0.08em; font-family: 'JetBrains Mono', monospace; cursor: pointer; 
    box-shadow: var(--shadow-epic); transition: all 0.3s ease; text-transform: uppercase;
  }
  select:hover { border-color: var(--accent); box-shadow: 0 0 20px var(--accent-dim), var(--shadow-epic); }
  select option { background: #000; color: var(--white); }
  .select-row { display: flex; gap: 12px; }

  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 30px; }
  button { cursor: pointer; font-family: inherit; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700;
    padding: 12px 24px; text-transform: uppercase; letter-spacing: 0.08em;
    background: #000; color: var(--white); border: var(--ink-border); border-color: var(--hair);
    box-shadow: var(--shadow-epic);
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .btn:hover { 
    border-color: var(--accent); color: var(--accent);
    box-shadow: 0 0 25px var(--accent-dim), var(--shadow-epic); 
    transform: translateY(-2px); 
  }
  .btn:active { transform: translateY(0); }
  .btn.active, .btn.primary { 
    background: var(--accent); color: #000; border-color: #000; 
    text-shadow: none; box-shadow: 0 0 25px var(--accent-glow); 
  }
  .btn.active:hover, .btn.primary:hover {
    background: var(--white); color: #000; box-shadow: 0 0 35px rgba(255,255,255,0.4);
  }

  .warn { font-size: 13px; color: #ff4a4a; font-family: 'JetBrains Mono', monospace; text-shadow: 0 0 10px rgba(255,74,74,0.5); }

  .add-form {
    display: flex; align-items: center; gap: 12px; margin-bottom: 30px; padding: 20px;
    background: var(--panel); border: var(--ink-border); box-shadow: var(--shadow-epic);
    backdrop-filter: blur(10px);
  }
  .add-form input {
    flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 14px; padding: 12px 18px;
    background: #000; border: 1px solid var(--hair); color: var(--white); outline: none; 
    letter-spacing: 0.05em; transition: all 0.3s ease;
  }
  .add-form input:focus { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-dim); }
  .add-form input::placeholder { color: var(--dim); }

  .empty {
    text-align: center; padding: 80px 20px; border: var(--ink-border); color: var(--dim); 
    margin-bottom: 30px; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
  }
  .empty .big { 
    font-size: 28px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em; 
    color: var(--white); margin-bottom: 12px; text-shadow: 0 0 30px rgba(255,255,255,0.2); 
  }
  .empty .small { font-size: 13px; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.05em; }

  /* Comic Book Art Panels */
  .panel { 
    background: var(--panel); border: var(--ink-border); padding: 24px; 
    margin-bottom: 30px; box-shadow: var(--shadow-epic); backdrop-filter: blur(12px);
  }

  .chart-svg { width: 100%; display: block; }
  .chart-svg.bar { height: clamp(220px, 28vw, 300px); }
  .chart-svg.line { height: clamp(280px, 36vw, 420px); }
  .grid-line { stroke: var(--hair); stroke-width: 1; stroke-dasharray: 4 4; }
  .axis-label { fill: var(--dim); font-size: 12px; font-family: 'JetBrains Mono', monospace; }
  .bar-value { fill: var(--white); font-size: 12px; font-family: 'JetBrains Mono', monospace; font-weight: 700; }

  .legend { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 15px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; font-family: 'JetBrains Mono', monospace; color: var(--white); text-transform: uppercase; }
  .legend-dot { width: 10px; height: 10px; flex-shrink: 0; border: 1px solid #000; }

  .table-wrap {
    overflow-x: auto; background: var(--panel); border: var(--ink-border); 
    box-shadow: var(--shadow-epic); width: 100%; position: relative; backdrop-filter: blur(12px);
  }
  table { border-collapse: collapse; width: 100%; min-width: 860px; table-layout: fixed; }
  th, td { white-space: nowrap; }
  th.list-head, td.name-cell { white-space: normal; }
  
  thead th {
    text-align: center; font-weight: 400; padding: 12px 6px; font-size: 12px;
    border-left: 1px solid var(--hair); border-bottom: var(--ink-border);
    font-family: 'JetBrains Mono', monospace; color: var(--dim); background: #000;
  }
  thead th.weekend { background: #050505; }
  thead th.today-col { 
    background: var(--accent); color: #000; font-weight: 700; 
    box-shadow: 0 0 20px var(--accent-glow); border-left-color: #000;
  }
  thead .list-head {
    position: sticky; left: 0; z-index: 3; text-align: left; font-weight: 700; 
    text-transform: uppercase; letter-spacing: 0.1em; padding: 12px 15px 12px 24px; 
    border-right: var(--ink-border); background: #000; color: var(--white); 
    font-family: 'Oswald', sans-serif; font-size: 16px; width: 220px;
    box-shadow: 10px 0 20px rgba(0,0,0,0.8);
  }
  
  tbody td.name-cell {
    position: sticky; left: 0; z-index: 3; background: var(--panel-alt); 
    border-right: var(--ink-border); border-top: 1px solid var(--hair); 
    padding: 12px 15px 12px 24px; box-shadow: 10px 0 20px rgba(0,0,0,0.8);
  }
  tbody td.day-cell { text-align: center; padding: 10px 4px; border-left: 1px solid var(--hair); border-top: 1px solid var(--hair); }
  tbody td.day-cell.weekend { background: rgba(0,0,0,0.3); }
  tbody tr:hover td.day-cell { background: rgba(255,140,66,0.05); }
  
  .name-row { display: flex; align-items: flex-start; gap: 12px; }
  .name-dot { width: 12px; height: 12px; flex-shrink: 0; border: 1px solid #000; margin-top: 5px; }
  .name-text { 
    font-weight: 500; font-size: 16px; text-transform: uppercase; letter-spacing: 0.05em; 
    word-break: break-word; overflow-wrap: break-word; min-width: 0; flex: 1; font-family: 'Oswald', sans-serif;
  }
  .del-btn { 
    margin-left: 4px; margin-top: 2px; flex-shrink: 0; opacity: 0.2; background: none; 
    border: none; color: #ff4a4a; display: flex; align-items: center; transition: all 0.2s ease; 
  }
  .del-btn:hover { opacity: 1; filter: drop-shadow(0 0 8px rgba(255,74,74,0.8)); transform: scale(1.1); }

  /* Smooth Cinematic Checks */
  .cell-today {
    width: 28px; height: 28px; border: var(--ink-border); border-color: var(--dim); 
    background: #000; display: flex; align-items: center; justify-content: center; 
    margin: 0 auto; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: inset 0 2px 4px rgba(0,0,0,1); cursor: pointer;
  }
  .cell-today:hover { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); transform: scale(1.15); }
  .cell-today.checked { 
    background: var(--accent); border-color: #000; 
    box-shadow: 0 0 20px var(--accent-glow), inset 0 0 8px rgba(255,255,255,0.5); 
  }

  .cell-future {
    width: 28px; height: 28px; border: 1px dashed var(--hair); display: flex; 
    align-items: center; justify-content: center; margin: 0 auto; color: var(--hair);
  }
  .cell-past {
    width: 28px; height: 28px; border: 1px solid rgba(255,255,255,0.05); display: flex; 
    align-items: center; justify-content: center; margin: 0 auto; opacity: 0.4; background: #000;
  }
  .cell-past.checked { opacity: 1; border-color: #000; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); }

  .foot-note { 
    font-size: 12px; color: var(--dim); font-family: 'JetBrains Mono', monospace; 
    letter-spacing: 0.05em; margin-top: 15px; text-transform: uppercase;
  }

  @media (max-width: 640px) {
    #app { padding: 30px 15px 80px; }
    .header { flex-direction: column; align-items: flex-start; }
    thead .list-head, tbody td.name-cell { width: 150px; padding-left: 15px; }
  }

  /* ===== Theme Switcher ===== */
  .theme-switcher{
    position:fixed; top:14px; right:14px; z-index:9999;
    display:flex; gap:8px; padding:8px;
    background:rgba(0,0,0,0.55); border:1px solid rgba(255,255,255,0.18);
    border-radius:30px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .theme-dot{
    width:18px; height:18px; border-radius:50%; display:block;
    border:2px solid rgba(255,255,255,0.3); box-sizing:border-box;
    text-decoration:none; transition:transform .2s ease, border-color .2s ease;
  }
  .theme-dot:hover{ transform:scale(1.25); border-color:#fff; }
  .theme-dot.active{ border-color:#fff; box-shadow:0 0 10px currentColor; transform:scale(1.15); pointer-events:none; cursor:default; }
  @media (max-width:520px){
    .theme-switcher{ top:8px; right:8px; padding:6px; gap:6px; }
    .theme-dot{ width:14px; height:14px; }
  }
</style>
</head>
<body>
<div class="theme-switcher" role="navigation" aria-label="Switch theme">
  <a href="index.html" class="theme-dot" style="background:#dca431" title="Dark Fantasy"></a>
  <a href="i2.html" class="theme-dot" style="background:#e4283c" title="Crimson Noir"></a>
  <a href="i3.html" class="theme-dot active" style="background:#ff8c42" title="Amber Grade"></a>
  <a href="i4.html" class="theme-dot" style="background:#10b981" title="Cinematic Emerald"></a>
  <a href="i5.html" class="theme-dot" style="background:#00e5ff" title="Cyberpunk 2099"></a>
  <a href="i6.html" class="theme-dot" style="background:#ff2a4b" title="Studio Trigger"></a>
</div>
<div id="app"></div>

<script>
(function(){
  "use strict";

  var API_URL = "/api/data";
  /* Cinematic Color Palette */
  var PALETTE = ["#ff8c42", "#4299e1", "#48bb78", "#f56565", "#ed8936", "#38b2ac", "#9f7aea", "#ecc94b"];
  var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var MONTH_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  var topics = [];
  var checks = {};
  var view = "month";
  var showAdd = false;
  var syncWarning = false;
  var loadError = "";

  var now0 = new Date();
  var selMonth = now0.getMonth();
  var selYear = now0.getFullYear();

  function colorFor(i){ return PALETTE[i % PALETTE.length]; }
  function pad2(n){ return String(n).padStart(2,"0"); }
  function keyFor(y,m,d){ return y+"-"+pad2(m+1)+"-"+pad2(d); }
  function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
  function weekdayLetter(y,m,d){ return new Date(y,m,d).toLocaleDateString("en-US",{weekday:"narrow"}); }
  function isWeekend(y,m,d){ var day = new Date(y,m,d).getDay(); return day===0 || day===6; }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  async function loadData(){
    try{
      var res = await fetch(API_URL + "?t=" + Date.now(), { cache: "no-store" });
      if(!res.ok) throw new Error("Server returned " + res.status);
      var state = await res.json();
      topics = Array.isArray(state.topics) ? state.topics : [];
      checks = (state.checks && typeof state.checks === "object") ? state.checks : {};
      loadError = "";
    }catch(e){
      console.error("loadData failed", e);
      topics = []; checks = {};
      loadError = "Couldn't reach the backend \u2014 check your connection and reload. Changes made now won't be saved.";
    }
  }

  async function persist(){
    try{
      var res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ topics: topics, checks: checks })
      });
      if(!res.ok) throw new Error("Server returned " + res.status);
      syncWarning = false;
    }catch(e){
      console.error("persist failed", e);
      syncWarning = true;
    }
    render();
  }

  function cellStatus(y,m,d,todayOnly){
    var t = new Date(y,m,d).getTime();
    if(t === todayOnly) return "today";
    return t > todayOnly ? "future" : "past";
  }

  function addTopic(name){
    name = (name||"").trim();
    if(!name) return;
    topics.push({ id: "t" + Date.now() + Math.floor(Math.random()*1000), name: name });
    render();
    persist();
  }

  function deleteTopic(id, name){
    var ok = window.confirm('Remove "' + name + '" and all its history? This can\'t be undone.');
    if(!ok) return;
    topics = topics.filter(function(t){ return t.id !== id; });
    delete checks[id];
    render();
    persist();
  }

  function toggleCheck(topicId, key, todayKey){
    if(key !== todayKey) return;
    if(!checks[topicId]) checks[topicId] = {};
    if(checks[topicId][key]) delete checks[topicId][key];
    else checks[topicId][key] = true;
    render();
    persist();
  }

  function buildBarChartSVG(data){
    var w = 900, h = 220, padL = 10, padR = 10, padT = 26, padB = 34;
    var chartW = w - padL - padR, chartH = h - padT - padB;
    var maxVal = Math.max(1, Math.max.apply(null, data.map(function(d){return d.count;})));
    var n = data.length || 1;
    var gap = 18;
    var barW = Math.max(20, (chartW / n) - gap);
    var defs = '<defs><filter id="glow" x="-60%" y="-60%" width="220%" height="220%">' +
      '<feGaussianBlur stdDeviation="4" result="blur"/>' +
      '<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>' +
      '</filter></defs>';
    data.forEach(function(d,i){
      defs += '<linearGradient id="barGrad'+i+'" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="'+d.fill+'" stop-opacity="1"/>' +
        '<stop offset="100%" stop-color="'+d.fill+'" stop-opacity="0.2"/>' +
        '</linearGradient>';
    });
    var grid = "";
    for(var g=0; g<=4; g++){
      var gy = padT + chartH - (g/4)*chartH;
      grid += '<line x1="'+padL+'" y1="'+gy+'" x2="'+(w-padR)+'" y2="'+gy+'" class="grid-line"/>';
    }
    var bars = "";
    data.forEach(function(d,i){
      var x = padL + i*(barW+gap) + gap/2;
      var barH = Math.max(2, (d.count/maxVal) * chartH);
      var y = padT + chartH - barH;
      var maxChars = Math.max(3, Math.floor(barW / 7));
      var label = d.name.length > maxChars ? (d.name.slice(0, Math.max(1,maxChars-1)) + "\u2026") : d.name;
      
      // Comic book ink outline on bars
      bars += '<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+barH+'" rx="0" fill="url(#barGrad'+i+')" stroke="#000" stroke-width="2" filter="url(#glow)"/>';
      bars += '<text x="'+(x+barW/2)+'" y="'+(h-10)+'" text-anchor="middle" class="axis-label">'+escapeHtml(label)+(label!==d.name ? '<title>'+escapeHtml(d.name)+'</title>' : '')+'</text>';
      bars += '<text x="'+(x+barW/2)+'" y="'+(y-12)+'" text-anchor="middle" class="bar-value">'+d.count+'</text>';
    });
    return '<svg viewBox="0 0 '+w+' '+h+'" class="chart-svg bar" preserveAspectRatio="none">'+defs+grid+bars+'</svg>';
  }

  function buildLineChartSVG(months, series){
    var w = 960, h = 320, padL = 24, padR = 24, padT = 18, padB = 34;
    var chartW = w - padL - padR, chartH = h - padT - padB;
    var allVals = series.reduce(function(acc,s){ return acc.concat(s.values); }, []);
    var maxVal = Math.max(1, Math.max.apply(null, allVals.length ? allVals : [0]));
    var stepX = chartW / Math.max(1, months.length - 1);
    var defs = '<defs><filter id="lineGlow" x="-60%" y="-60%" width="220%" height="220%">' +
      '<feGaussianBlur stdDeviation="3.5" result="blur"/>' +
      '<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>' +
      '</filter></defs>';
    var grid = "";
    for(var g=0; g<=4; g++){
      var gy = padT + chartH - (g/4)*chartH;
      grid += '<line x1="'+padL+'" y1="'+gy+'" x2="'+(w-padR)+'" y2="'+gy+'" class="grid-line"/>';
    }
    var xlabels = "";
    months.forEach(function(m,i){
      var x = padL + i*stepX;
      xlabels += '<text x="'+x+'" y="'+(h-10)+'" text-anchor="middle" class="axis-label">'+m+'</text>';
    });
    var lines = "";
    series.forEach(function(s){
      var pts = s.values.map(function(v,i){
        var x = padL + i*stepX;
        var y = padT + chartH - (v/maxVal)*chartH;
        return x+","+y;
      }).join(" ");
      
      // Black stroke underneath for comic feel
      lines += '<polyline points="'+pts+'" fill="none" stroke="#000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>';
      lines += '<polyline points="'+pts+'" fill="none" stroke="'+s.color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#lineGlow)"/>';
      
      s.values.forEach(function(v,i){
        var x = padL + i*stepX;
        var y = padT + chartH - (v/maxVal)*chartH;
        lines += '<circle cx="'+x+'" cy="'+y+'" r="4.5" fill="#000"/>';
        lines += '<circle cx="'+x+'" cy="'+y+'" r="3" fill="'+s.color+'" filter="url(#lineGlow)"/>';
      });
    });
    return '<svg viewBox="0 0 '+w+' '+h+'" class="chart-svg line" preserveAspectRatio="none">'+defs+grid+lines+xlabels+'</svg>';
  }

  function render(){
    var now = new Date();
    var todayY = now.getFullYear(), todayM = now.getMonth(), todayD = now.getDate();
    var todayOnly = new Date(todayY, todayM, todayD).getTime();
    var todayKey = keyFor(todayY, todayM, todayD);

    var yearOptions = [];
    for(var y = todayY - 5; y <= todayY + 1; y++) yearOptions.push(y);

    var todayDoneCount = topics.filter(function(t){ return checks[t.id] && checks[t.id][todayKey]; }).length;
    var todayPct = topics.length ? Math.round((todayDoneCount/topics.length)*100) : 0;

    var html = "";

    // header
    html += '<div class="header">';
    html += '  <div>';
    html += '    <h1 class="title">Daily <span>Ledger</span></h1>';
    html += '    <div class="title-rule"></div>';
    html += '    <div class="subtitle mono">' + (view==="month"
              ? (MONTH_NAMES[todayM]+" "+todayD+", "+todayY)
              : ("YEAR "+selYear+" OVERVIEW")) + '</div>';
    if(view==="month" && topics.length>0){
      html += '    <div class="progress-row">';
      html += '      <div class="progress-track"><div class="progress-fill" style="width:'+todayPct+'%"></div></div>';
      html += '      <span class="progress-text mono">'+todayDoneCount+' / '+topics.length+'</span>';
      html += '    </div>';
    }
    html += '  </div>';

    if(view === "month"){
      html += '  <div class="select-row">';
      html += '    <select id="monthSelect">';
      MONTH_NAMES.forEach(function(m,i){
        html += '<option value="'+i+'"'+(i===selMonth?' selected':'')+'>'+m+'</option>';
      });
      html += '    </select>';
      html += '    <select id="yearSelect">';
      yearOptions.forEach(function(yy){
        html += '<option value="'+yy+'"'+(yy===selYear?' selected':'')+'>'+yy+'</option>';
      });
      html += '    </select>';
      html += '  </div>';
    } else {
      html += '  <select id="yearSelectAnnual">';
      yearOptions.forEach(function(yy){
        html += '<option value="'+yy+'"'+(yy===selYear?' selected':'')+'>'+yy+'</option>';
      });
      html += '  </select>';
    }
    html += '</div>';

    // actions
    html += '<div class="actions">';
    if(view === "month"){
      html += '<button class="btn '+(showAdd?' active':'')+'" data-action="toggle-add">+ ADD TOPIC</button>';
    }
    html += '<button class="btn '+(view==="year"?' active':'')+'" data-action="toggle-view">'+(view==="year"?'\u2261 RETURN TO LIST':'\u25A4 ANNUAL GRAPH')+'</button>';
    if(syncWarning){
      html += '<span class="warn">SYNC FAILED \u2014 CHECK CONNECTION</span>';
    }
    html += '</div>';

    if(loadError){
      html += '<div class="warn" style="display:block;margin-bottom:20px;">'+escapeHtml(loadError)+'</div>';
    }

    // add form
    if(showAdd && view === "month"){
      html += '<div class="add-form">';
      html += '  <input id="newTopicInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="ENTER NEW DIRECTIVE..." />';
      html += '  <button class="btn primary" data-action="submit-add">CONFIRM</button>';
      html += '  <button class="btn" data-action="cancel-add">CANCEL</button>';
      html += '</div>';
    }

    if(topics.length === 0){
      html += '<div class="empty">';
      html += '  <div class="big">SYSTEM EMPTY</div>';
      html += '  <div class="small mono">INITIALIZE A TOPIC TO COMMENCE TRACKING</div>';
      html += '</div>';
    }

    if(topics.length > 0 && view === "month"){
      var numDays = daysInMonth(selYear, selMonth);
      var dayList = [];
      for(var d=1; d<=numDays; d++) dayList.push(d);

      // bar chart data
      var barData = topics.map(function(t,i){
        var count = 0;
        dayList.forEach(function(d){
          var k = keyFor(selYear, selMonth, d);
          if(checks[t.id] && checks[t.id][k]) count++;
        });
        return { name: t.name, count: count, fill: colorFor(i) };
      });

      html += '<div class="panel">' + buildBarChartSVG(barData) + '</div>';

      // table
      html += '<div class="table-wrap"><table><thead><tr>';
      html += '<th class="list-head">DIRECTIVE</th>';
      dayList.forEach(function(d){
        var weekend = isWeekend(selYear, selMonth, d);
        var status = cellStatus(selYear, selMonth, d, todayOnly);
        var cls = status==="today" ? "today-col" : (weekend ? "weekend" : "");
        html += '<th class="'+cls+'"><div>'+d+'</div><div style="font-size:10px;opacity:.6">'+weekdayLetter(selYear, selMonth, d)+'</div></th>';
      });
      html += '</tr></thead><tbody>';

      topics.forEach(function(topic, ti){
        html += '<tr>';
        html += '<td class="name-cell"><div class="name-row">';
        html += '<span class="name-dot" style="background:'+colorFor(ti)+';box-shadow:0 0 10px '+colorFor(ti)+'"></span>';
        html += '<span class="name-text">'+escapeHtml(topic.name)+'</span>';
        html += '<button class="del-btn" data-action="delete-topic" data-id="'+topic.id+'" data-name="'+escapeHtml(topic.name)+'" aria-label="Delete">';
        html += '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';
        html += '</button>';
        html += '</div></td>';

        dayList.forEach(function(d){
          var status = cellStatus(selYear, selMonth, d, todayOnly);
          var key = keyFor(selYear, selMonth, d);
          var checked = !!(checks[topic.id] && checks[topic.id][key]);
          var weekend = isWeekend(selYear, selMonth, d);
          html += '<td class="day-cell'+(weekend?' weekend':'')+'">';
          if(status === "today"){
            html += '<div class="cell-today'+(checked?' checked':'')+'" data-action="toggle-check" data-id="'+topic.id+'" data-key="'+key+'">';
            if(checked) html += '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="4"><polyline points="20 6 9 17 4 12"/></svg>';
            html += '</div>';
          } else if(status === "future"){
            html += '<div class="cell-future"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>';
          } else {
            html += '<div class="cell-past'+(checked?' checked':'')+'" style="'+(checked ? ('background:'+colorFor(ti)) : '')+'">';
            if(checked) html += '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3.5"><polyline points="20 6 9 17 4 12"/></svg>';
            html += '</div>';
          }
          html += '</td>';
        });
        html += '</tr>';
      });

      html += '</tbody></table></div>';
      html += '<div class="foot-note">>> ACTIVE SECTOR: TODAY ONLY. PAST DIRECTIVES LOCKED.</div>';
    }

    if(topics.length > 0 && view === "year"){
      var annualSeries = topics.map(function(t,i){
        var values = MONTH_SHORT.map(function(mn, mi){
          var dim = daysInMonth(selYear, mi);
          var count = 0;
          for(var dd=1; dd<=dim; dd++){
            var k = keyFor(selYear, mi, dd);
            if(checks[t.id] && checks[t.id][k]) count++;
          }
          return count;
        });
        return { name: t.name, color: colorFor(i), values: values };
      });

      html += '<div class="panel">';
      html += buildLineChartSVG(MONTH_SHORT, annualSeries);
      html += '<div class="legend">';
      annualSeries.forEach(function(s){
        html += '<div class="legend-item"><span class="legend-dot" style="background:'+s.color+'"></span>'+escapeHtml(s.name)+'</div>';
      });
      html += '</div>';
      html += '<div class="foot-note">>> SYSTEM OVERVIEW: '+selYear+'.</div>';
      html += '</div>';
    }

    document.getElementById("app").innerHTML = html;

    if(showAdd){
      var inp = document.getElementById("newTopicInput");
      if(inp) inp.focus();
    }
  }

  document.addEventListener("DOMContentLoaded", function(){
    var app = document.getElementById("app");
    app.innerHTML = '<div class="foot-note mono" style="padding:40px;text-align:center;">ESTABLISHING UPLINK\u2026</div>';

    app.addEventListener("click", function(e){
      var el = e.target.closest("[data-action]");
      if(!el) return;
      var action = el.dataset.action;
      if(action === "toggle-add"){ showAdd = !showAdd; render(); }
      else if(action === "toggle-view"){ view = (view === "month") ? "year" : "month"; render(); }
      else if(action === "cancel-add"){ showAdd = false; render(); }
      else if(action === "submit-add"){
        var input = document.getElementById("newTopicInput");
        addTopic(input ? input.value : "");
      }
      else if(action === "delete-topic"){ deleteTopic(el.dataset.id, el.dataset.name); }
      else if(action === "toggle-check"){
        var now = new Date();
        var todayKey = keyFor(now.getFullYear(), now.getMonth(), now.getDate());
        toggleCheck(el.dataset.id, el.dataset.key, todayKey);
      }
    });

    app.addEventListener("change", function(e){
      if(e.target.id === "monthSelect"){ selMonth = Number(e.target.value); render(); }
      else if(e.target.id === "yearSelect"){ selYear = Number(e.target.value); render(); }
      else if(e.target.id === "yearSelectAnnual"){ selYear = Number(e.target.value); render(); }
    });

    app.addEventListener("keydown", function(e){
      if(e.target.id === "newTopicInput"){
        if(e.key === "Enter") addTopic(e.target.value);
        if(e.key === "Escape"){ showAdd = false; render(); }
      }
    });

    loadData().then(function(){
      try{
        render();
      }catch(err){
        app.innerHTML = '<div style="max-width:640px;margin:60px auto;padding:24px;border:2px solid #ff4a4a;background:#000;color:var(--white);font-family:\'JetBrains Mono\',monospace;font-size:13px;white-space:pre-wrap;">RENDER ERROR:\n' + (err && err.stack ? err.stack : err) + '</div>';
      }
    });
  });
})();
</script>
</body>
</html>
