<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Ledger - CYBERPUNK 2099</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg: #03040b;
    --panel: rgba(10, 11, 21, 0.85);
    --panel-alt: rgba(18, 20, 38, 0.9);
    --hair: #1f2342;
    --white: #e0f7fa;
    --dim: #748ca6;
    
    /* Cyberpunk Neon Palette */
    --neon-cyan: #00f3ff;
    --neon-magenta: #ff00ea;
    --neon-yellow: #fcee0a;
    --neon-orange: #ff5e00;
    
    --glow-cyan: rgba(0, 243, 255, 0.55);
    --glow-cyan-soft: rgba(0, 243, 255, 0.15);
    --glow-magenta: rgba(255, 0, 234, 0.55);
    
    --gray: #394660;
    --shadow-deep: 0 10px 40px rgba(0,0,0,0.8), 0 0 0 1px inset rgba(0, 243, 255, 0.1);
  }

  *{ box-sizing:border-box; }

  html{ background:var(--bg); }

  body{
    margin:0;
    position:relative;
    background-color:var(--bg);
    /* Atmospheric hyperrealistic lighting gradients */
    background-image:
      radial-gradient(ellipse 1400px 900px at 20% -10%, rgba(0, 243, 255, 0.15), transparent 60%),
      radial-gradient(ellipse 1200px 1000px at 80% 110%, rgba(255, 0, 234, 0.12), transparent 55%),
      linear-gradient(180deg, rgba(3,4,11,0.9) 0%, rgba(3,4,11,0.6) 100%),
      repeating-linear-gradient(0deg, rgba(0, 243, 255, 0.02) 0px, rgba(0, 243, 255, 0.02) 1px, transparent 1px, transparent 30px);
    color:var(--white);
    font-family:'Rajdhani', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }

  /* CRT Scanlines & Screen Texture */
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:100;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
    background-size: 100% 3px, 3px 100%;
    opacity:0.4;
    mix-blend-mode: overlay;
  }
  
  body::after{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:1;
    box-shadow:inset 0 0 150px rgba(0,0,0,0.95);
  }

  .mono{ font-family:'JetBrains Mono', monospace; }

  #app{ position:relative; z-index:2; max-width:1900px; width:100%; margin:0 auto; padding:40px clamp(16px,4vw,60px) 80px; }

  /* Sharp geometric cuts for tech aesthetic */
  .cut{ clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px); }
  .cut-sm{ clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }

  .header{
    display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between;
    gap:20px; margin-bottom:35px; padding-bottom:25px; border-bottom:1px solid var(--neon-cyan); 
    position:relative;
    box-shadow: 0 15px 30px -15px var(--glow-cyan-soft);
  }
  .title{
    font-family: 'Orbitron', sans-serif;
    font-size:clamp(36px,5vw,56px); font-weight:900; text-transform:uppercase; letter-spacing:0.15em;
    text-shadow: 2px 2px 0px rgba(255,0,234,0.7), -2px -2px 0px rgba(0,243,255,0.7), 0 0 30px var(--glow-cyan); 
    margin:0; line-height:1;
  }
  .title span{ color:var(--neon-magenta); text-shadow: 0 0 20px var(--glow-magenta); animation:neon-flicker 5s infinite alternate; }
  .title-rule{
    width:100px; height:4px; margin-top:16px; background:linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta), transparent);
    box-shadow:0 0 15px var(--glow-cyan);
  }
  .subtitle{ font-size:14px; color:var(--neon-cyan); letter-spacing:0.15em; margin-top:14px; text-transform: uppercase; text-shadow: 0 0 5px var(--glow-cyan-soft); }

  .progress-row{ display:flex; align-items:center; gap:12px; margin-top:16px; }
  .progress-track{ width:200px; height:8px; background:var(--bg); border:1px solid var(--neon-cyan); box-shadow:inset 0 0 10px rgba(0,243,255,0.2); }
  .progress-fill{ height:100%; background:linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta)); box-shadow:0 0 15px var(--glow-magenta); transition:width .4s ease; }
  .progress-text{ font-size:13px; font-weight: 700; color:var(--neon-yellow); letter-spacing:0.1em; text-shadow: 0 0 8px rgba(252, 238, 10, 0.5); }

  @keyframes neon-flicker{
    0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; text-shadow: 0 0 20px var(--glow-magenta); }
    20%, 24%, 55% { opacity: 0.4; text-shadow: none; }
  }

  select{
    appearance:none; -webkit-appearance:none; background-color:rgba(10,11,21,0.9); color:var(--neon-cyan);
    border:1px solid var(--neon-cyan); padding:12px 20px; font-size:13px; font-weight: 700; letter-spacing:0.1em;
    font-family:'JetBrains Mono', monospace; cursor:pointer; box-shadow: 0 0 10px var(--glow-cyan-soft);
    text-transform: uppercase; transition:all .2s ease;
  }
  select:hover{ box-shadow:0 0 20px var(--glow-cyan), inset 0 0 10px var(--glow-cyan-soft); background: rgba(0,243,255,0.1); }
  select option{ background:#0a0b15; color:var(--white); }
  .select-row{ display:flex; gap:12px; }

  .actions{ display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:30px; }
  button{ cursor:pointer; font-family:inherit; }

  .btn{
    display:inline-flex; align-items:center; justify-content: center; gap:8px; font-size:14px; font-weight:700;
    padding:12px 24px; text-transform:uppercase; letter-spacing:0.1em;
    background:rgba(0, 243, 255, 0.05); color:var(--neon-cyan); border:1px solid var(--neon-cyan);
    box-shadow: 0 0 10px var(--glow-cyan-soft), inset 0 0 5px var(--glow-cyan-soft);
    transition:all .2s ease; font-family: 'Orbitron', sans-serif;
  }
  .btn:hover{ background: rgba(0, 243, 255, 0.15); box-shadow:0 0 25px var(--glow-cyan), inset 0 0 15px var(--glow-cyan-soft); transform:translateY(-2px); text-shadow: 0 0 8px var(--neon-cyan); }
  .btn:active{ transform:translateY(0); }
  .btn.active, .btn.primary{ background:var(--neon-cyan); color:#000; border-color:var(--neon-cyan); box-shadow: 0 0 20px var(--glow-cyan); text-shadow: none; font-weight: 900; }
  .btn.active:hover, .btn.primary:hover { background: #fff; box-shadow: 0 0 30px #fff; border-color: #fff; }

  .warn{ font-size:13px; color:var(--neon-yellow); font-family:'JetBrains Mono', monospace; text-shadow: 0 0 10px rgba(252,238,10,0.6); border-left: 2px solid var(--neon-yellow); padding-left: 10px;}

  .add-form{
    display:flex; align-items:center; gap:12px; margin-bottom:30px; padding:20px;
    background:var(--panel-alt); border:1px solid var(--neon-magenta); box-shadow: 0 0 20px rgba(255,0,234,0.2), inset 0 0 10px rgba(255,0,234,0.1);
  }
  .add-form input{
    flex:1; font-family:'JetBrains Mono', monospace; font-size:14px; font-weight:500; padding:12px 18px;
    background:rgba(0,0,0,0.6); border:1px solid var(--hair); color:var(--white); outline:none; letter-spacing:0.05em;
    transition:all .2s ease;
  }
  .add-form input:focus{ border-color:var(--neon-magenta); box-shadow:0 0 15px var(--glow-magenta); }
  .add-form input::placeholder{ color:var(--gray); text-transform: uppercase; }

  .empty{
    text-align:center; padding:80px 20px; border:1px dashed var(--neon-cyan); color:var(--dim); margin-bottom:30px;
    background:radial-gradient(ellipse at center, rgba(0,243,255,0.05), transparent 70%);
  }
  .empty .big{ font-family: 'Orbitron', sans-serif; font-size:24px; font-weight:700; text-transform:uppercase; letter-spacing:0.15em; color:var(--neon-cyan); margin-bottom:12px; text-shadow:0 0 15px var(--glow-cyan); }
  .empty .small{ font-size:13px; font-family:'JetBrains Mono', monospace; letter-spacing:0.1em; color: var(--dim); }

  .panel{ background:var(--panel); border:1px solid var(--hair); padding:24px; margin-bottom:30px; box-shadow:var(--shadow-deep); backdrop-filter: blur(10px); }

  .chart-svg{ width:100%; display:block; filter: drop-shadow(0 0 10px rgba(0,243,255,0.3)); }
  .chart-svg.bar{ height:clamp(220px,28vw,280px); }
  .chart-svg.line{ height:clamp(280px,36vw,400px); }
  .grid-line{ stroke:var(--hair); stroke-width:1; stroke-dasharray: 4 4; }
  .axis-label{ fill:var(--dim); font-size:11px; font-family:'JetBrains Mono', monospace; }
  .bar-value{ fill:var(--white); font-size:12px; font-weight:700; font-family:'JetBrains Mono', monospace; text-shadow: 0 0 5px rgba(255,255,255,0.5); }

  .legend{ display:flex; flex-wrap:wrap; gap:20px; margin-top:16px; justify-content: center; }
  .legend-item{ display:flex; align-items:center; gap:8px; font-size:12px; font-family:'JetBrains Mono', monospace; color:var(--white); text-transform: uppercase; }
  .legend-dot{ width:10px; height:10px; flex-shrink:0; box-shadow: 0 0 10px currentColor; }

  .table-wrap{
    overflow-x:auto; background:var(--panel); border:1px solid var(--hair); box-shadow:var(--shadow-deep);
    width:100%; position:relative; border-top:2px solid var(--neon-cyan); backdrop-filter: blur(5px);
  }
  table{ border-collapse:collapse; width:100%; min-width:860px; table-layout:fixed; font-size:14px; }
  th, td{ white-space:nowrap; }
  th.list-head, td.name-cell{ white-space:normal; }
  thead th{
    text-align:center; font-weight:600; padding:12px 6px; font-size:12px;
    border-left:1px solid var(--hair); border-bottom: 1px solid var(--hair); font-family:'JetBrains Mono', monospace; color:var(--dim);
    background:rgba(0,0,0,0.4); text-transform: uppercase;
  }
  thead th.weekend{ background:rgba(0,0,0,0.7); }
  thead th.today-col{ background:rgba(0,243,255,0.1); color:var(--neon-cyan); font-weight:700; box-shadow:inset 0 0 15px rgba(0,243,255,0.3); border-bottom: 2px solid var(--neon-cyan); }
  thead .list-head{
    position:sticky; left:0; z-index:3; text-align:left; font-weight:700; text-transform:uppercase;
    letter-spacing:0.1em; padding:12px 16px 12px 24px; border-right:2px solid var(--neon-cyan); background:var(--panel-alt);
    color:var(--neon-cyan); font-family:'Orbitron',sans-serif; width:220px;
    box-shadow:5px 0 15px rgba(0,0,0,0.8);
  }
  tbody td.name-cell{
    position:sticky; left:0; z-index:3; background:var(--panel); border-right:2px solid var(--neon-cyan);
    border-top:1px solid var(--hair); padding:12px 16px 12px 24px;
    box-shadow:5px 0 15px rgba(0,0,0,0.8);
  }
  tbody td.day-cell{ text-align:center; padding:10px 4px; border-left:1px solid var(--hair); border-top:1px solid var(--hair); }
  tbody td.day-cell.weekend{ background:rgba(0,0,0,0.3); }
  tbody tr:hover td{ background:rgba(0,243,255,0.05); }
  tbody tr:hover td.name-cell{ background:rgba(18,20,38,1); }

  .name-row{ display:flex; align-items:flex-start; gap:12px; }
  .name-dot{ width:10px; height:10px; flex-shrink:0; border-radius:50%; margin-top:5px; }
  .name-text{ font-weight:600; font-size:15px; text-transform:uppercase; letter-spacing:0.08em; word-break:break-word; overflow-wrap:break-word; min-width:0; flex:1; }
  .del-btn{ margin-left:4px; margin-top:2px; flex-shrink:0; opacity:0.4; background:none; border:none; color:var(--neon-magenta); display:flex; align-items:center; transition:all .2s ease; cursor: pointer; }
  .del-btn:hover{ opacity:1; filter: drop-shadow(0 0 5px var(--neon-magenta)); transform: scale(1.1); }

  .cell-today{
    width:28px; height:28px; border:1px solid var(--neon-cyan); background:transparent; display:flex;
    align-items:center; justify-content:center; margin:0 auto; transition:all .2s ease;
    animation:pulse-idle 2s ease-in-out infinite; cursor: pointer;
  }
  .cell-today:hover{ box-shadow:0 0 20px var(--glow-cyan), inset 0 0 10px var(--glow-cyan-soft); transform:scale(1.15); background: rgba(0,243,255,0.2); }
  .cell-today.checked{ background:var(--neon-cyan); border-color: #fff; box-shadow:0 0 20px var(--glow-cyan); animation:none; color: #000; }

  @keyframes pulse-idle{
    0%,100%{ box-shadow:0 0 0 rgba(0,243,255,0); }
    50%{ box-shadow:0 0 12px var(--glow-cyan-soft); }
  }

  .cell-future{
    width:28px; height:28px; border:1px dashed var(--gray); display:flex; align-items:center;
    justify-content:center; margin:0 auto; color:var(--gray); background: rgba(0,0,0,0.2);
  }
  .cell-past{
    width:28px; height:28px; border:1px solid var(--hair); display:flex; align-items:center;
    justify-content:center; margin:0 auto; opacity:0.4; background: rgba(0,0,0,0.5);
  }
  .cell-past.checked{ opacity:1; background: rgba(255,255,255,0.05); border-width: 1px; }

  .foot-note{ font-size:12px; color:var(--dim); font-family:'JetBrains Mono', monospace; letter-spacing:0.05em; margin-top:16px; text-transform: uppercase; text-align: center;}

  @media (max-width:768px){
    .header{ flex-direction:column; align-items: flex-start; }
    thead .list-head, tbody td.name-cell{ width:160px; padding-left:16px; }
  }

  /* ===== Theme Switcher ===== */
  .theme-switcher{
    position:fixed; top:14px; right:14px; z-index:9999;
    display:flex; gap:8px; padding:8px;
    background:rgba(0,0,0,0.55); border:1px solid rgba(255,255,255,0.18);
    border-radius:30px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .theme-dot{
    width:18px; height:18px; border-radius:50%; display:block;
    border:2px solid rgba(255,255,255,0.3); box-sizing:border-box;
    text-decoration:none; transition:transform .2s ease, border-color .2s ease;
  }
  .theme-dot:hover{ transform:scale(1.25); border-color:#fff; }
  .theme-dot.active{ border-color:#fff; box-shadow:0 0 10px currentColor; transform:scale(1.15); pointer-events:none; cursor:default; }
  @media (max-width:520px){
    .theme-switcher{ top:8px; right:8px; padding:6px; gap:6px; }
    .theme-dot{ width:14px; height:14px; }
  }
</style>
</head>

  <a href="i6.html" class="theme-dot" style="background:#ff2a4b" title="Studio Trigger"></a>

<div id="app"></div>

<script>
(function(){
  "use strict";

  var API_URL = "/api/data";
  // Updated PALETTE for Cyberpunk aesthetic
  var PALETTE = ["#00f3ff", "#ff00ea", "#fcee0a", "#ff5e00", "#b500ff", "#00ff9d", "#ff003c", "#0088ff"];
  var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var MONTH_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  var topics = [];
  var checks = {};
  var view = "month";
  var showAdd = false;
  var syncWarning = false;
  var loadError = "";

  var now0 = new Date();
  var selMonth = now0.getMonth();
  var selYear = now0.getFullYear();

  function colorFor(i){ return PALETTE[i % PALETTE.length]; }
  function pad2(n){ return String(n).padStart(2,"0"); }
  function keyFor(y,m,d){ return y+"-"+pad2(m+1)+"-"+pad2(d); }
  function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
  function weekdayLetter(y,m,d){ return new Date(y,m,d).toLocaleDateString("en-US",{weekday:"narrow"}); }
  function isWeekend(y,m,d){ var day = new Date(y,m,d).getDay(); return day===0 || day===6; }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  async function loadData(){
    try{
      var res = await fetch(API_URL + "?t=" + Date.now(), { cache: "no-store" });
      if(!res.ok) throw new Error("Server returned " + res.status);
      var state = await res.json();
      topics = Array.isArray(state.topics) ? state.topics : [];
      checks = (state.checks && typeof state.checks === "object") ? state.checks : {};
      loadError = "";
    }catch(e){
      console.error("loadData failed", e);
      topics = []; checks = {};
      loadError = "SYSTEM OFFLINE \u2014 UNABLE TO CONNECT TO MAINFRAME. LOCAL CHANGES TEMPORARY.";
    }
  }

  async function persist(){
    try{
      var res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ topics: topics, checks: checks })
      });
      if(!res.ok) throw new Error("Server returned " + res.status);
      syncWarning = false;
    }catch(e){
      console.error("persist failed", e);
      syncWarning = true;
    }
    render();
  }

  function cellStatus(y,m,d,todayOnly){
    var t = new Date(y,m,d).getTime();
    if(t === todayOnly) return "today";
    return t > todayOnly ? "future" : "past";
  }

  function addTopic(name){
    name = (name||"").trim();
    if(!name) return;
    topics.push({ id: "t" + Date.now() + Math.floor(Math.random()*1000), name: name });
    render();
    persist();
  }

  function deleteTopic(id, name){
    var ok = window.confirm('PURGE "' + name + '" FROM DATABANKS? IRREVERSIBLE ACTION.');
    if(!ok) return;
    topics = topics.filter(function(t){ return t.id !== id; });
    delete checks[id];
    render();
    persist();
  }

  function toggleCheck(topicId, key, todayKey){
    if(key !== todayKey) return;
    if(!checks[topicId]) checks[topicId] = {};
    if(checks[topicId][key]) delete checks[topicId][key];
    else checks[topicId][key] = true;
    render();
    persist();
  }

  function buildBarChartSVG(data){
    var w = 900, h = 240, padL = 20, padR = 20, padT = 30, padB = 40;
    var chartW = w - padL - padR, chartH = h - padT - padB;
    var maxVal = Math.max(1, Math.max.apply(null, data.map(function(d){return d.count;})));
    var n = data.length || 1;
    var gap = 24;
    var barW = Math.max(20, (chartW / n) - gap);
    
    var defs = '<defs><filter id="glow" x="-60%" y="-60%" width="220%" height="220%">' +
      '<feGaussianBlur stdDeviation="4" result="blur"/>' +
      '<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>' +
      '</filter></defs>';
      
    data.forEach(function(d,i){
      defs += '<linearGradient id="barGrad'+i+'" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="'+d.fill+'" stop-opacity="0.9"/>' +
        '<stop offset="100%" stop-color="'+d.fill+'" stop-opacity="0.1"/>' +
        '</linearGradient>';
    });
    
    var grid = "";
    for(var g=0; g<=4; g++){
      var gy = padT + chartH - (g/4)*chartH;
      grid += '<line x1="'+padL+'" y1="'+gy+'" x2="'+(w-padR)+'" y2="'+gy+'" class="grid-line"/>';
    }
    
    var bars = "";
    data.forEach(function(d,i){
      var x = padL + i*(barW+gap) + gap/2;
      var barH = Math.max(2, (d.count/maxVal) * chartH);
      var y = padT + chartH - barH;
      var maxChars = Math.max(3, Math.floor(barW / 7));
      var label = d.name.length > maxChars ? (d.name.slice(0, Math.max(1,maxChars-1)) + "\u2026") : d.name;
      
      bars += '<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+barH+'" rx="0" fill="url(#barGrad'+i+')" filter="url(#glow)"/>';
      // Adding a bright top edge for cyber aesthetic
      bars += '<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="3" fill="#fff" opacity="0.8"/>';
      bars += '<text x="'+(x+barW/2)+'" y="'+(h-12)+'" text-anchor="middle" class="axis-label" style="fill:'+d.fill+';">'+escapeHtml(label)+(label!==d.name ? '<title>'+escapeHtml(d.name)+'</title>' : '')+'</text>';
      bars += '<text x="'+(x+barW/2)+'" y="'+(y-10)+'" text-anchor="middle" class="bar-value" style="fill:'+d.fill+'; filter: drop-shadow(0 0 4px '+d.fill+');">'+d.count+'</text>';
    });
    return '<svg viewBox="0 0 '+w+' '+h+'" class="chart-svg bar" preserveAspectRatio="none">'+defs+grid+bars+'</svg>';
  }

  function buildLineChartSVG(months, series){
    var w = 960, h = 340, padL = 30, padR = 30, padT = 20, padB = 40;
    var chartW = w - padL - padR, chartH = h - padT - padB;
    var allVals = series.reduce(function(acc,s){ return acc.concat(s.values); }, []);
    var maxVal = Math.max(1, Math.max.apply(null, allVals.length ? allVals : [0]));
    var stepX = chartW / Math.max(1, months.length - 1);
    
    var defs = '<defs><filter id="lineGlow" x="-60%" y="-60%" width="220%" height="220%">' +
      '<feGaussianBlur stdDeviation="3" result="blur"/>' +
      '<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>' +
      '</filter></defs>';
      
    var grid = "";
    for(var g=0; g<=4; g++){
      var gy = padT + chartH - (g/4)*chartH;
      grid += '<line x1="'+padL+'" y1="'+gy+'" x2="'+(w-padR)+'" y2="'+gy+'" class="grid-line"/>';
    }
    
    var xlabels = "";
    months.forEach(function(m,i){
      var x = padL + i*stepX;
      xlabels += '<text x="'+x+'" y="'+(h-12)+'" text-anchor="middle" class="axis-label">'+m+'</text>';
    });
    
    var lines = "";
    series.forEach(function(s){
      var pts = s.values.map(function(v,i){
        var x = padL + i*stepX;
        var y = padT + chartH - (v/maxVal)*chartH;
        return x+","+y;
      }).join(" ");
      lines += '<polyline points="'+pts+'" fill="none" stroke="'+s.color+'" stroke-width="3" stroke-linejoin="miter" stroke-linecap="square" filter="url(#lineGlow)"/>';
      s.values.forEach(function(v,i){
        var x = padL + i*stepX;
        var y = padT + chartH - (v/maxVal)*chartH;
        lines += '<circle cx="'+x+'" cy="'+y+'" r="4" fill="#000" stroke="'+s.color+'" stroke-width="2" filter="url(#lineGlow)"/>';
      });
    });
    return '<svg viewBox="0 0 '+w+' '+h+'" class="chart-svg line" preserveAspectRatio="none">'+defs+grid+lines+xlabels+'</svg>';
  }

  function render(){
    var now = new Date();
    var todayY = now.getFullYear(), todayM = now.getMonth(), todayD = now.getDate();
    var todayOnly = new Date(todayY, todayM, todayD).getTime();
    var todayKey = keyFor(todayY, todayM, todayD);

    var yearOptions = [];
    for(var y = todayY - 5; y <= todayY + 1; y++) yearOptions.push(y);

    var todayDoneCount = topics.filter(function(t){ return checks[t.id] && checks[t.id][todayKey]; }).length;
    var todayPct = topics.length ? Math.round((todayDoneCount/topics.length)*100) : 0;

    var html = "";

    // header
    html += '<div class="header">';
    html += '  <div>';
    html += '    <h1 class="title">Daily <span>Ledger</span></h1>';
    html += '    <div class="title-rule"></div>';
    html += '    <div class="subtitle mono">' + (view==="month"
              ? ("SYSTEM DATE // " + MONTH_NAMES[todayM].toUpperCase()+" "+todayD+", "+todayY)
              : ("CYCLE OVERVIEW // "+selYear)) + '</div>';
    if(view==="month" && topics.length>0){
      html += '    <div class="progress-row">';
      html += '      <div class="progress-track"><div class="progress-fill" style="width:'+todayPct+'%"></div></div>';
      html += '      <span class="progress-text mono">'+todayDoneCount+' / '+topics.length+' DATASTREAMS</span>';
      html += '    </div>';
    }
    html += '  </div>';

    if(view === "month"){
      html += '  <div class="select-row">';
      html += '    <select id="monthSelect">';
      MONTH_NAMES.forEach(function(m,i){
        html += '<option value="'+i+'"'+(i===selMonth?' selected':'')+'>'+m.toUpperCase()+'</option>';
      });
      html += '    </select>';
      html += '    <select id="yearSelect">';
      yearOptions.forEach(function(yy){
        html += '<option value="'+yy+'"'+(yy===selYear?' selected':'')+'>'+yy+'</option>';
      });
      html += '    </select>';
      html += '  </div>';
    } else {
      html += '  <select id="yearSelectAnnual">';
      yearOptions.forEach(function(yy){
        html += '<option value="'+yy+'"'+(yy===selYear?' selected':'')+'>'+yy+'</option>';
      });
      html += '  </select>';
    }
    html += '</div>';

    // actions
    html += '<div class="actions">';
    if(view === "month"){
      html += '<button class="btn cut-sm'+(showAdd?' active':'')+'" data-action="toggle-add">[\u2022] INIT NODE</button>';
    }
    html += '<button class="btn cut-sm'+(view==="year"?' active':'')+'" data-action="toggle-view">'+(view==="year"?'\u2261 RETURN TO GRID':'\u25A4 GLOBAL METRICS')+'</button>';
    if(syncWarning){
      html += '<span class="warn">NETWORK ERROR \u2014 UPLOAD FAILED. CHECK CONNECTION.</span>';
    }
    html += '</div>';

    if(loadError){
      html += '<div class="warn" style="display:block;margin-bottom:20px; font-size:14px; border:1px solid var(--neon-yellow); background: rgba(252,238,10,0.1); padding: 15px;">'+escapeHtml(loadError)+'</div>';
    }

    // add form
    if(showAdd && view === "month"){
      html += '<div class="add-form cut">';
      html += '  <input id="newTopicInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="ENTER NEW DIRECTIVE..." />';
      html += '  <button class="btn cut-sm primary" data-action="submit-add">EXECUTE</button>';
      html += '  <button class="btn cut-sm" data-action="cancel-add">ABORT</button>';
      html += '</div>';
    }

    if(topics.length === 0){
      html += '<div class="empty">';
      html += '  <div class="big">DATABANK EMPTY</div>';
      html += '  <div class="small mono">AWAITING INPUT...</div>';
      html += '</div>';
    }

    if(topics.length > 0 && view === "month"){
      var numDays = daysInMonth(selYear, selMonth);
      var dayList = [];
      for(var d=1; d<=numDays; d++) dayList.push(d);

      // bar chart data
      var barData = topics.map(function(t,i){
        var count = 0;
        dayList.forEach(function(d){
          var k = keyFor(selYear, selMonth, d);
          if(checks[t.id] && checks[t.id][k]) count++;
        });
        return { name: t.name, count: count, fill: colorFor(i) };
      });

      html += '<div class="panel cut">' + buildBarChartSVG(barData) + '</div>';

      // table
      html += '<div class="table-wrap"><table><thead><tr>';
      html += '<th class="list-head">DIRECTIVE</th>';
      dayList.forEach(function(d){
        var weekend = isWeekend(selYear, selMonth, d);
        var status = cellStatus(selYear, selMonth, d, todayOnly);
        var cls = status==="today" ? "today-col" : (weekend ? "weekend" : "");
        html += '<th class="'+cls+'"><div>'+pad2(d)+'</div><div style="font-size:10px;opacity:.8; margin-top: 3px;">'+weekdayLetter(selYear, selMonth, d)+'</div></th>';
      });
      html += '</tr></thead><tbody>';

      topics.forEach(function(topic, ti){
        html += '<tr>';
        html += '<td class="name-cell"><div class="name-row">';
        html += '<span class="name-dot" style="background:'+colorFor(ti)+';box-shadow:0 0 10px '+colorFor(ti)+'"></span>';
        html += '<span class="name-text" style="color:'+colorFor(ti)+'; text-shadow: 0 0 5px '+colorFor(ti)+'">'+escapeHtml(topic.name)+'</span>';
        html += '<button class="del-btn" data-action="delete-topic" data-id="'+topic.id+'" data-name="'+escapeHtml(topic.name)+'" aria-label="Delete">';
        html += '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';
        html += '</button>';
        html += '</div></td>';

        dayList.forEach(function(d){
          var status = cellStatus(selYear, selMonth, d, todayOnly);
          var key = keyFor(selYear, selMonth, d);
          var checked = !!(checks[topic.id] && checks[topic.id][key]);
          var weekend = isWeekend(selYear, selMonth, d);
          html += '<td class="day-cell'+(weekend?' weekend':'')+'">';
          if(status === "today"){
            html += '<button class="cell-today'+(checked?' checked':'')+'" data-action="toggle-check" data-id="'+topic.id+'" data-key="'+key+'" aria-label="Toggle">';
            if(checked) html += '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';
            html += '</button>';
          } else if(status === "future"){
            html += '<div class="cell-future"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>';
          } else {
            html += '<div class="cell-past'+(checked?' checked':'')+'" style="'+(checked ? ('border-color:'+colorFor(ti)+';background: rgba(0,0,0,0.8)') : '')+'">';
            if(checked) html += '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="'+colorFor(ti)+'" stroke-width="3" style="filter:drop-shadow(0 0 3px '+colorFor(ti)+')"><polyline points="20 6 9 17 4 12"/></svg>';
            html += '</div>';
          }
          html += '</td>';
        });
        html += '</tr>';
      });

      html += '</tbody></table></div>';
      html += '<div class="foot-note">CURRENT CYCLE ONLY ACTIVE. PAST LOGS ARCHIVED. FUTURE SECTORS RESTRICTED.</div>';
    }

    if(topics.length > 0 && view === "year"){
      var annualSeries = topics.map(function(t,i){
        var values = MONTH_SHORT.map(function(mn, mi){
          var dim = daysInMonth(selYear, mi);
          var count = 0;
          for(var dd=1; dd<=dim; dd++){
            var k = keyFor(selYear, mi, dd);
            if(checks[t.id] && checks[t.id][k]) count++;
          }
          return count;
        });
        return { name: t.name, color: colorFor(i), values: values };
      });

      html += '<div class="panel cut">';
      html += buildLineChartSVG(MONTH_SHORT, annualSeries);
      html += '<div class="legend">';
      annualSeries.forEach(function(s){
        html += '<div class="legend-item"><span class="legend-dot" style="background:'+s.color+'; color:'+s.color+'"></span><span style="color:'+s.color+'; text-shadow:0 0 4px '+s.color+'">'+escapeHtml(s.name)+'</span></div>';
      });
      html += '</div>';
      html += '<div class="foot-note">DATA AGGREGATION ACROSS CYCLE '+selYear+'.</div>';
      html += '</div>';
    }

    document.getElementById("app").innerHTML = html;

    if(showAdd){
      var inp = document.getElementById("newTopicInput");
      if(inp) inp.focus();
    }
  }

  document.addEventListener("DOMContentLoaded", function(){
    var app = document.getElementById("app");
    app.innerHTML = '<div class="foot-note mono" style="padding:60px;text-align:center; font-size: 16px; color: var(--neon-cyan); text-shadow: 0 0 10px var(--glow-cyan);">ESTABLISHING SECURE CONNECTION TO MAINFRAME...</div>';

    app.addEventListener("click", function(e){
      var el = e.target.closest("[data-action]");
      if(!el) return;
      var action = el.dataset.action;
      if(action === "toggle-add"){ showAdd = !showAdd; render(); }
      else if(action === "toggle-view"){ view = (view === "month") ? "year" : "month"; render(); }
      else if(action === "cancel-add"){ showAdd = false; render(); }
      else if(action === "submit-add"){
        var input = document.getElementById("newTopicInput");
        addTopic(input ? input.value : "");
      }
      else if(action === "delete-topic"){ deleteTopic(el.dataset.id, el.dataset.name); }
      else if(action === "toggle-check"){
        var now = new Date();
        var todayKey = keyFor(now.getFullYear(), now.getMonth(), now.getDate());
        toggleCheck(el.dataset.id, el.dataset.key, todayKey);
      }
    });

    app.addEventListener("change", function(e){
      if(e.target.id === "monthSelect"){ selMonth = Number(e.target.value); render(); }
      else if(e.target.id === "yearSelect"){ selYear = Number(e.target.value); render(); }
      else if(e.target.id === "yearSelectAnnual"){ selYear = Number(e.target.value); render(); }
    });

    app.addEventListener("keydown", function(e){
      if(e.target.id === "newTopicInput"){
        if(e.key === "Enter") addTopic(e.target.value);
        if(e.key === "Escape"){ showAdd = false; render(); }
      }
    });

    loadData().then(function(){
      try{
        render();
      }catch(err){
        app.innerHTML = '<div style="max-width:640px;margin:60px auto;padding:24px;border:1px solid var(--neon-magenta);background:var(--panel);color:var(--neon-magenta);font-family:\'JetBrains Mono\',monospace;font-size:14px;white-space:pre-wrap; box-shadow: 0 0 20px rgba(255,0,234,0.3);">SYSTEM FAILURE DETECTED:\n' + (err && err.stack ? err.stack : err) + '</div>';
      }
    });
  });
})();
</script>
</body>
</html>
